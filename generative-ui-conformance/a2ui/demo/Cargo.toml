# Its own workspace root: this crate lives inside the wovyr repo but is not a
# member of the root workspace (which lists members explicitly), so it needs an
# empty [workspace] table to avoid "believes it's in a workspace when it's not".
[workspace]

[package]
name = "a2ui-trust-demo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The wovyr generative-UI trust layer, compiled to wasm, evaluating real A2UI surfaces."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wovyr-ui = { path = "../../../crates/wovyr-ui" }
wovyr-ui-guard = { path = "../../../crates/wovyr-ui-guard" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
