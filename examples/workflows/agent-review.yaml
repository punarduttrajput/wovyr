apiVersion: workflow.apex.io/v1
kind: Workflow
metadata:
  name: agent-review
  version: 1.0.0
spec:
  # `agent` activities run a real agent (model + tool loop) — resolved differently
  # depending on how you run this workflow:
  #   - Server: `name` is a *stored* agent id — register one first, e.g.
  #     POST /api/v1/agents { "manifest": "<the hello.yaml contents>" }  (stores it as `hello`)
  #   - CLI: `apex workflows run --local -f examples/workflows/agent-review.yaml \
  #       --agents-dir examples/agents --input '{"ticketText": "..."}'`
  #     resolves `name` as `<agents-dir>/<name>.yaml` on disk (no server needed).
  activities:
    - id: draft
      type: agent
      name: hello
      inputs: { message: "${input.ticketText}" }

    - id: postReply
      type: tool
      name: echo
      inputs: { action: send_reply, body: "${draft.message}" }

  transitions:
    - { from: draft, to: postReply }
