# Multi-window burn-rate rules for the Wovyr API availability SLO (RM-AIM-P3
# OBS-302). Complements `alerts.yml` (single-window symptom alerts, RM-GA-P4
# OBS-803) with the SRE-workbook multi-window, multi-burn-rate pattern: each
# alert requires the error-budget burn to be visible in BOTH a long window
# (sustained — not a blip) and a short window (still happening — not already
# recovered), so pages fire fast on real incidents and stay quiet otherwise.
#
# SLO baked in below: **99.5% availability** (5xx ratio ≤ 0.5%) over a 30-day
# budget window. To adopt a different target, scale each threshold: the alert
# constant is `burn_rate × (1 - SLO)`, e.g. for 99.9% replace 0.072 with
# 0.0144 (14.4 × 0.001), 0.03 with 0.006, 0.005 with 0.001.
#
# Validate with `promtool check rules burn-rates.yml`. The recording rules also
# feed the "SLO burn" panel in `dashboard.json`.
groups:
  - name: wovyr.slo.recordings
    rules:
      # Error ratio (5xx / all) at each window the burn-rate pairs below need.
      # Recorded once so every alert and dashboard panel evaluates the same
      # series instead of re-deriving it.
      - record: wovyr:api_error_ratio:rate5m
        expr: >
          sum(rate(wovyr_api_requests_total{status=~"5.."}[5m]))
            /
          sum(rate(wovyr_api_requests_total[5m]))
      - record: wovyr:api_error_ratio:rate30m
        expr: >
          sum(rate(wovyr_api_requests_total{status=~"5.."}[30m]))
            /
          sum(rate(wovyr_api_requests_total[30m]))
      - record: wovyr:api_error_ratio:rate1h
        expr: >
          sum(rate(wovyr_api_requests_total{status=~"5.."}[1h]))
            /
          sum(rate(wovyr_api_requests_total[1h]))
      - record: wovyr:api_error_ratio:rate6h
        expr: >
          sum(rate(wovyr_api_requests_total{status=~"5.."}[6h]))
            /
          sum(rate(wovyr_api_requests_total[6h]))
      - record: wovyr:api_error_ratio:rate3d
        expr: >
          sum(rate(wovyr_api_requests_total{status=~"5.."}[3d]))
            /
          sum(rate(wovyr_api_requests_total[3d]))

  - name: wovyr.slo.burn
    rules:
      # Fast burn (page): 14.4× budget burn — exhausts 2% of the 30-day error
      # budget within one hour. Long window 1h, short window 5m.
      # 14.4 × (1 - 0.995) = 0.072.
      - alert: WovyrErrorBudgetFastBurn
        expr: >
          wovyr:api_error_ratio:rate1h > 0.072
            and
          wovyr:api_error_ratio:rate5m > 0.072
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Wovyr is burning its API error budget at ≥14.4× (fast burn)"
          description: >
            The 5xx ratio is above 7.2% over both the last hour and the last
            5 minutes — at this rate 2% of the 30-day error budget for the
            99.5% availability SLO is gone within the hour. Page-worthy:
            investigate now via `wovyr_api_requests_total` by `route`/`status`
            and the failing requests' `X-Request-Id` in logs/audit.

      # Slow burn (page): 6× budget burn — exhausts 5% of the budget in 6h.
      # Long window 6h, short window 30m. 6 × (1 - 0.995) = 0.03.
      - alert: WovyrErrorBudgetSlowBurn
        expr: >
          wovyr:api_error_ratio:rate6h > 0.03
            and
          wovyr:api_error_ratio:rate30m > 0.03
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Wovyr is burning its API error budget at ≥6× (slow burn)"
          description: >
            The 5xx ratio has exceeded 3% over both the last 6 hours and the
            last 30 minutes — a sustained elevated error rate that consumes
            5% of the 30-day budget every 6 hours.

      # Trickle burn (ticket): 1× budget burn — on pace to exactly exhaust the
      # budget by the end of the 30-day window. Long window 3d, short window
      # 6h. 1 × (1 - 0.995) = 0.005. Not page-worthy; file and fix.
      - alert: WovyrErrorBudgetTrickleBurn
        expr: >
          wovyr:api_error_ratio:rate3d > 0.005
            and
          wovyr:api_error_ratio:rate6h > 0.005
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Wovyr API error rate is on pace to exhaust its 30-day budget"
          description: >
            The 5xx ratio has exceeded the 0.5% SLO threshold over both the
            last 3 days and the last 6 hours — no incident-grade spike, but
            left alone the 30-day error budget runs out on schedule.

  - name: wovyr.operability
    rules:
      # Backpressure alerts over the OBS-301 gauges (recomputed at every scrape
      # from the durable stores, so they survive restarts and never drift).
      - alert: WovyrWebhookDLQGrowing
        expr: delta(wovyr_webhook_dlq_size[1h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Wovyr webhook dead-letter queue is growing"
          description: >
            {{ $value | humanize }} deliveries were dead-lettered in the last
            hour (retry budget exhausted). Inspect them via
            `GET /api/v1/webhooks/dead-letters` and check the subscriber
            endpoints — dead letters are never retried automatically.

      - alert: WovyrWebhookOutboxBacklog
        expr: wovyr_webhook_outbox_pending > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Wovyr webhook outbox has a sustained backlog"
          description: >
            {{ $value | humanize }} webhook deliveries have been pending for
            15+ minutes — deliveries are being enqueued faster than they
            complete. Check subscriber latency/outages before the retry
            budgets exhaust into the DLQ. Tune the `100` threshold to the
            deployment's normal delivery volume.
