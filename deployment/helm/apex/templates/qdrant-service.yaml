{{- if .Values.qdrant.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apex.fullname" . }}-qdrant
  labels:
    {{- include "apex.labels" . | nindent 4 }}
    {{- include "apex.qdrant.selectorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 6333
  selector:
    {{- include "apex.qdrant.selectorLabels" . | nindent 4 }}
{{- end }}
