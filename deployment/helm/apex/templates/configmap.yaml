# Non-sensitive apex-server configuration. Connection strings with embedded
# credentials (APEX_MARKETPLACE_POSTGRES_URL, APEX_MEMORY_POSTGRES_URL) live
# in secret.yaml instead, even though the qdrant URL and platform-admins list
# here are no more sensitive than any other config value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apex.fullname" . }}-config
  labels:
    {{- include "apex.labels" . | nindent 4 }}
data:
  # Explicit rather than relying on the container's /etc/passwd entry for the
  # non-root `apex` user (uid 10001, home /home/apex per
  # deployment/docker/Dockerfile) — some container runtimes don't populate
  # $HOME from NSS for a non-login process exec.
  HOME: /home/apex
  {{- if .Values.qdrant.enabled }}
  APEX_MEMORY_QDRANT_URL: {{ include "apex.qdrantUrl" . | quote }}
  {{- end }}
  {{- if .Values.apex.env.platformAdmins }}
  APEX_PLATFORM_ADMINS: {{ .Values.apex.env.platformAdmins | quote }}
  {{- end }}
  {{- if .Values.apex.env.authMode }}
  APEX_AUTH_MODE: {{ .Values.apex.env.authMode | quote }}
  {{- end }}
  {{- if .Values.apex.tls.enabled }}
  {{- if not .Values.apex.tls.secretName }}
  {{- fail "apex.tls.enabled requires apex.tls.secretName (an existing kubernetes.io/tls Secret)" }}
  {{- end }}
  # RM-AIM-P3 DEP-302: in-process TLS — the cert/key mount from
  # apex.tls.secretName (see apex-statefulset.yaml). Mutually exclusive with
  # APEX_TLS_TERMINATED_UPSTREAM: with a real certificate served by the
  # process itself, the fronting-proxy declaration must not also be emitted
  # (it would mask a broken mount behind the proxy claim).
  APEX_TLS_CERT: /etc/apex/tls/tls.crt
  APEX_TLS_KEY: /etc/apex/tls/tls.key
  {{- else if .Values.apex.env.tlsTerminatedUpstream }}
  APEX_TLS_TERMINATED_UPSTREAM: {{ .Values.apex.env.tlsTerminatedUpstream | quote }}
  {{- end }}
