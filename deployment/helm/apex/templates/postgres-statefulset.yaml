# Backs APEX_MARKETPLACE_POSTGRES_URL/APEX_MEMORY_POSTGRES_URL — the
# marketplace registry is genuinely wired to this (apex-server selects
# PostgresRegistryStore when the postgres feature + this URL are set); memory
# is CLI-only (see qdrant-statefulset.yaml's comment for the same caveat).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "apex.fullname" . }}-postgres
  labels:
    {{- include "apex.labels" . | nindent 4 }}
    {{- include "apex.postgres.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "apex.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "apex.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apex.labels" . | nindent 8 }}
        {{- include "apex.postgres.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          # Only the three keys this container actually needs — not the
          # whole Secret (that would also leak APEX_KMS_ROOT_KEY/
          # OPENAI_API_KEY into postgres's environment for no reason).
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "apex.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "apex.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "apex.fullname" . }}-secrets
                  key: POSTGRES_DB
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
