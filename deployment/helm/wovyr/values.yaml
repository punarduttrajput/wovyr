# Default values for the wovyr chart. See README.md for the full mapping back
# to deployment/docker-compose.yml and the gaps this chart doesn't close.

wovyr:
  image:
    # The image .github/workflows/release.yml publishes on every version tag
    # (RM-AIM-P1 DX-102), built from deployment/docker/Dockerfile with
    # FEATURES=tiered-memory,postgres to match the values below. Override for a
    # locally-built image (e.g. repository: wovyr, tag: dev).
    repository: ghcr.io/punarduttrajput/wovyr
    tag: 0.4.1
    pullPolicy: IfNotPresent
  # Fixed at 1: wovyr's durable state (~/.wovyr/{tenancy,kms,secrets,webhooks,
  # workflows,memory,audit}) is local files on a PVC, not shared/replicated —
  # horizontal scaling isn't supported yet (matches the project's own
  # documented state: no sharding/multi-region support today).
  replicaCount: 1
  port: 8080
  env:
    # WOVYR_PLATFORM_ADMINS — comma-separated principal ids with platform-admin
    # scope. Optional; empty means no platform admins (fail-closed default).
    platformAdmins: ""
    # RM-GA-P1 SEC-101: wovyr_server::serve() refuses every request without a
    # verified credential once bound to a non-loopback address (this pod's
    # 0.0.0.0 bind always is) — apikey is the scheme with no extra chart wiring
    # (no JWT issuer/secret to provision here). Mint a key against the pod's
    # `~/.wovyr/auth` (the same PVC the running server reads):
    #   kubectl exec -it <pod> -- wovyr auth create-key <principal>
    authMode: "apikey"
    # RM-GA-P1 SEC-202: `serve()` refuses to bind non-loopback without either
    # real TLS or this explicit acknowledgment that TLS is terminated in front
    # of it (an Ingress/Gateway/service mesh sidecar). Ignored (not emitted)
    # when `wovyr.tls.enabled` below wires in-process TLS instead.
    tlsTerminatedUpstream: "1"
  # RM-AIM-P3 DEP-302: optional **in-process** TLS — the alternative to
  # `tlsTerminatedUpstream` for clusters with no TLS-terminating
  # Ingress/mesh in front of the pod. Points WOVYR_TLS_CERT/WOVYR_TLS_KEY at a
  # standard `kubernetes.io/tls` Secret (keys `tls.crt`/`tls.key`) you
  # provision out-of-band (e.g. cert-manager, `kubectl create secret tls`).
  # When enabled, WOVYR_TLS_TERMINATED_UPSTREAM is deliberately not emitted —
  # in-process TLS and a fronting-proxy declaration are distinct trust
  # models, and emitting both would mask a broken TLS mount behind the
  # proxy claim. Both probes switch to HTTPS.
  tls:
    enabled: false
    # Name of an existing kubernetes.io/tls Secret in the release namespace.
    # Required when enabled; the chart fails at template time if empty.
    secretName: ""
  secrets:
    # WOVYR_KMS_ROOT_KEY (hex). Empty -> wovyr-server falls back to a fully
    # ephemeral in-process root key (logged loudly) — fine for a smoke test,
    # NOT for production (every secret/memory record sealed under it becomes
    # unrecoverable on pod restart). Generate one with:
    #   openssl rand -hex 32
    kmsRootKey: ""
    # OPENAI_API_KEY. Empty -> the deterministic offline mock provider (no
    # real model calls). Set this for a real LLM backend.
    openaiApiKey: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    size: 1Gi
    storageClassName: ""
  service:
    type: ClusterIP

postgres:
  image: postgres:16
  # Matches docker-compose.yml's defaults exactly. Override all three in
  # production — these are committed-to-git placeholders, not secrets.
  user: wovyr
  password: wovyr
  database: wovyr
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 5Gi
    storageClassName: ""

qdrant:
  # Wired for the CLI's `wovyr memory put/query` tiered-memory backend only —
  # the embedded wovyr-server ignores it and always uses its local file store
  # (see this chart's README.md and deployment/docker-compose.yml's own
  # comment for the same gap). Set false if you never run tiered-memory CLI
  # commands against this cluster.
  enabled: true
  image: qdrant/qdrant:latest
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    size: 5Gi
    storageClassName: ""

ingress:
  enabled: false
  className: ""
  host: wovyr.example.com
  annotations: {}
  tls: []
