# Non-sensitive wovyr-server configuration. Connection strings with embedded
# credentials (WOVYR_MARKETPLACE_POSTGRES_URL, WOVYR_MEMORY_POSTGRES_URL) live
# in secret.yaml instead, even though the qdrant URL and platform-admins list
# here are no more sensitive than any other config value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wovyr.fullname" . }}-config
  labels:
    {{- include "wovyr.labels" . | nindent 4 }}
data:
  # Explicit rather than relying on the container's /etc/passwd entry for the
  # non-root `wovyr` user (uid 10001, home /home/wovyr per
  # deployment/docker/Dockerfile) — some container runtimes don't populate
  # $HOME from NSS for a non-login process exec.
  HOME: /home/wovyr
  {{- if .Values.qdrant.enabled }}
  WOVYR_MEMORY_QDRANT_URL: {{ include "wovyr.qdrantUrl" . | quote }}
  {{- end }}
  {{- if .Values.wovyr.env.platformAdmins }}
  WOVYR_PLATFORM_ADMINS: {{ .Values.wovyr.env.platformAdmins | quote }}
  {{- end }}
  {{- if .Values.wovyr.env.authMode }}
  WOVYR_AUTH_MODE: {{ .Values.wovyr.env.authMode | quote }}
  {{- end }}
  {{- if .Values.wovyr.tls.enabled }}
  {{- if not .Values.wovyr.tls.secretName }}
  {{- fail "wovyr.tls.enabled requires wovyr.tls.secretName (an existing kubernetes.io/tls Secret)" }}
  {{- end }}
  # RM-AIM-P3 DEP-302: in-process TLS — the cert/key mount from
  # wovyr.tls.secretName (see wovyr-statefulset.yaml). Mutually exclusive with
  # WOVYR_TLS_TERMINATED_UPSTREAM: with a real certificate served by the
  # process itself, the fronting-proxy declaration must not also be emitted
  # (it would mask a broken mount behind the proxy claim).
  WOVYR_TLS_CERT: /etc/wovyr/tls/tls.crt
  WOVYR_TLS_KEY: /etc/wovyr/tls/tls.key
  {{- else if .Values.wovyr.env.tlsTerminatedUpstream }}
  WOVYR_TLS_TERMINATED_UPSTREAM: {{ .Values.wovyr.env.tlsTerminatedUpstream | quote }}
  {{- end }}
