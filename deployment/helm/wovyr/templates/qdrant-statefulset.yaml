{{- if .Values.qdrant.enabled }}
# Backs WOVYR_MEMORY_QDRANT_URL — wired for the CLI's tiered-memory backend
# (`wovyr memory put/query --features tiered-memory`) only. The embedded
# wovyr-server (this chart's wovyr-statefulset.yaml) does NOT route memory
# through Qdrant/Postgres; it always uses its local file store at
# /home/wovyr/.wovyr/memory. Set qdrant.enabled: false if nothing in your
# cluster runs those CLI commands — see this chart's README.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "wovyr.fullname" . }}-qdrant
  labels:
    {{- include "wovyr.labels" . | nindent 4 }}
    {{- include "wovyr.qdrant.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "wovyr.fullname" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      {{- include "wovyr.qdrant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wovyr.labels" . | nindent 8 }}
        {{- include "wovyr.qdrant.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - name: http
              containerPort: 6333
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.qdrant.persistence.storageClassName }}
        storageClassName: {{ .Values.qdrant.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.qdrant.persistence.size }}
{{- end }}
