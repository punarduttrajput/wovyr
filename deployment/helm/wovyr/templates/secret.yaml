# Sensitive wovyr-server configuration: connection strings with embedded
# credentials, the KMS root key, and the LLM provider key.
#
# The values.yaml defaults for postgres.user/password/database are
# committed-to-git placeholders matching deployment/docker-compose.yml, not
# real secrets — override every field here in production, ideally by
# pointing an external-secrets/sealed-secrets controller at this Secret's
# keys instead of setting plaintext values on `helm install`/`--set`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wovyr.fullname" . }}-secrets
  labels:
    {{- include "wovyr.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Also used directly as postgres's own POSTGRES_USER/PASSWORD/DB env vars
  # (postgres-statefulset.yaml) so there's one source of truth for these
  # credentials, not two copies that could drift.
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  WOVYR_MARKETPLACE_POSTGRES_URL: {{ include "wovyr.postgresDsn" . | quote }}
  WOVYR_MEMORY_POSTGRES_URL: {{ include "wovyr.postgresDsn" . | quote }}
  {{- if .Values.wovyr.secrets.kmsRootKey }}
  WOVYR_KMS_ROOT_KEY: {{ .Values.wovyr.secrets.kmsRootKey | quote }}
  {{- end }}
  {{- if .Values.wovyr.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.wovyr.secrets.openaiApiKey | quote }}
  {{- end }}
