[workspace]
resolver = "3"
members = [
    "crates/apex-common",
    "crates/apex-provider",
    "crates/apex-tools",
    "crates/apex-agent",
    "crates/apex-workflow",
    "crates/apex-runtime",
    "crates/apex-memory",
    "crates/apex-telemetry",
    "crates/apex-plugin",
    "crates/apex-marketplace",
    "crates/apex-tenancy",
    "crates/apex-events",
    "crates/apex-secrets",
    "crates/apex-audit",
    "crates/apex-kms",
    "crates/apex-config",
    "crates/apex-eval",
    "crates/apex-server",
    "apps/apex-cli",
]

[workspace.package]
# Kept in lockstep with the latest release tag (RM-AIM-P1 DX-101) — see CHANGELOG.md.
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
# The one canonical repository URL (DX-101) — every manifest (this, both SDKs, the
# Helm chart) must agree with it.
repository = "https://github.com/punarduttrajput/Apex"

[workspace.dependencies]
# Internal crates
apex-common = { path = "crates/apex-common" }
apex-provider = { path = "crates/apex-provider" }
apex-tools = { path = "crates/apex-tools" }
apex-agent = { path = "crates/apex-agent" }
apex-workflow = { path = "crates/apex-workflow" }
apex-runtime = { path = "crates/apex-runtime" }
apex-memory = { path = "crates/apex-memory" }
apex-telemetry = { path = "crates/apex-telemetry" }
apex-plugin = { path = "crates/apex-plugin" }
apex-marketplace = { path = "crates/apex-marketplace" }
apex-tenancy = { path = "crates/apex-tenancy" }
apex-events = { path = "crates/apex-events" }
apex-secrets = { path = "crates/apex-secrets" }
apex-audit = { path = "crates/apex-audit" }
apex-kms = { path = "crates/apex-kms" }
apex-config = { path = "crates/apex-config" }
apex-eval = { path = "crates/apex-eval" }
apex-server = { path = "crates/apex-server" }

# External
# Cross-process advisory file locking (RM-GA-P2 DUR-403) — flock/LockFileEx via a
# tiny, dependency-light crate rather than hand-rolled platform FFI.
fs2 = "0.4"
# RM-GA-P4 HLTH-904: no default features here — every consumer's `tokio.workspace =
# true` declares exactly the features its own code needs (workspace-dependency
# feature overrides are additive/unioned, not replacements, so leaving `full` here
# would silently defeat every crate's own trimmed feature list).
tokio = { version = "1" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# AEAD/signing randomness (apex-kms's envelope encryption, apex-plugin's ed25519
# signing, apex-marketplace's signature verification, the CLI's `plugin keygen`/`sign`).
ring = "0.17"
# Content digests (apex-audit's hash chain, apex-events' HMAC signing prerequisite,
# apex-marketplace's package digests, apex-plugin's artifact verification, the
# server's plugin-catalog digests, the CLI's backup-manifest digests).
sha2 = "0.10"
# HMAC-SHA256 (apex-events' webhook payload signing; the CLI's AWS SigV4 request
# signing for an s3:// `apex admin backup` destination, GA-002 §4.1).
hmac = "0.12"
# Platform-API / plugin-manifest compatibility ranges (apex-plugin, apex-marketplace,
# apex-server, the CLI).
semver = "1"

[profile.release]
opt-level = 3
lto = "thin"
