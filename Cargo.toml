[workspace]
resolver = "3"
members = [
    "crates/wovyr-common",
    "crates/wovyr-provider",
    "crates/wovyr-tools",
    "crates/wovyr-tool-macros",
    "crates/wovyr-agent",
    "crates/wovyr-workflow",
    "crates/wovyr-runtime",
    "crates/wovyr-memory",
    "crates/wovyr-telemetry",
    "crates/wovyr-plugin",
    "crates/wovyr-plugin-sdk",
    "crates/wovyr-marketplace",
    "crates/wovyr-tenancy",
    "crates/wovyr-events",
    "crates/wovyr-secrets",
    "crates/wovyr-audit",
    "crates/wovyr-kms",
    "crates/wovyr-config",
    "crates/wovyr-eval",
    "crates/wovyr-ui",
    "crates/wovyr-ui-guard",
    "crates/wovyr-server",
    "apps/wovyr-cli",
]

[workspace.package]
# Kept in lockstep with the latest release tag (RM-AIM-P1 DX-101) — see CHANGELOG.md.
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
# The one canonical repository URL (DX-101) — every manifest (this, both SDKs, the
# Helm chart) must agree with it.
repository = "https://github.com/punarduttrajput/wovyr"

[workspace.dependencies]
# Internal crates — `version` is required alongside `path` so `cargo publish`
# emits manifests that resolve against the published crates.io versions rather
# than local paths (which don't exist on the registry). Kept in lockstep with
# the workspace `version` (RM-AIM-P1 DX-101) — see CHANGELOG.md.
wovyr-common = { path = "crates/wovyr-common", version = "0.4.0" }
wovyr-provider = { path = "crates/wovyr-provider", version = "0.4.0" }
wovyr-tools = { path = "crates/wovyr-tools", version = "0.4.0" }
wovyr-tool-macros = { path = "crates/wovyr-tool-macros", version = "0.4.0" }
wovyr-agent = { path = "crates/wovyr-agent", version = "0.4.0" }
wovyr-workflow = { path = "crates/wovyr-workflow", version = "0.4.0" }
wovyr-runtime = { path = "crates/wovyr-runtime", version = "0.4.0" }
wovyr-memory = { path = "crates/wovyr-memory", version = "0.4.0" }
wovyr-telemetry = { path = "crates/wovyr-telemetry", version = "0.4.0" }
wovyr-plugin = { path = "crates/wovyr-plugin", version = "0.4.0" }
wovyr-plugin-sdk = { path = "crates/wovyr-plugin-sdk", version = "0.4.0" }
wovyr-marketplace = { path = "crates/wovyr-marketplace", version = "0.4.0" }
wovyr-tenancy = { path = "crates/wovyr-tenancy", version = "0.4.0" }
wovyr-events = { path = "crates/wovyr-events", version = "0.4.0" }
wovyr-secrets = { path = "crates/wovyr-secrets", version = "0.4.0" }
wovyr-audit = { path = "crates/wovyr-audit", version = "0.4.0" }
wovyr-kms = { path = "crates/wovyr-kms", version = "0.4.0" }
wovyr-config = { path = "crates/wovyr-config", version = "0.4.0" }
wovyr-eval = { path = "crates/wovyr-eval", version = "0.4.0" }
wovyr-ui = { path = "crates/wovyr-ui", version = "0.4.0" }
wovyr-ui-guard = { path = "crates/wovyr-ui-guard", version = "0.4.0" }
wovyr-server = { path = "crates/wovyr-server", version = "0.4.0" }

# External
# Cross-process advisory file locking (RM-GA-P2 DUR-403) — flock/LockFileEx via a
# tiny, dependency-light crate rather than hand-rolled platform FFI.
fs2 = "0.4"
# RM-GA-P4 HLTH-904: no default features here — every consumer's `tokio.workspace =
# true` declares exactly the features its own code needs (workspace-dependency
# feature overrides are additive/unioned, not replacements, so leaving `full` here
# would silently defeat every crate's own trimmed feature list).
tokio = { version = "1" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# AEAD/signing randomness (wovyr-kms's envelope encryption, wovyr-plugin's ed25519
# signing, wovyr-marketplace's signature verification, the CLI's `plugin keygen`/`sign`).
ring = "0.17"
# Content digests (wovyr-audit's hash chain, wovyr-events' HMAC signing prerequisite,
# wovyr-marketplace's package digests, wovyr-plugin's artifact verification, the
# server's plugin-catalog digests, the CLI's backup-manifest digests).
sha2 = "0.10"
# HMAC-SHA256 (wovyr-events' webhook payload signing; the CLI's AWS SigV4 request
# signing for an s3:// `wovyr admin backup` destination, GA-002 §4.1).
hmac = "0.12"
# Platform-API / plugin-manifest compatibility ranges (wovyr-plugin, wovyr-marketplace,
# wovyr-server, the CLI).
semver = "1"
# JSON Schema derivation for `#[derive(Tool)]`'s generated `input_schema()`
# (SBX-303) — a tool's params struct derives `schemars::JsonSchema` instead of a
# hand-written `json!({...})` schema literal.
schemars = "1"

[profile.release]
opt-level = 3
lto = "thin"
