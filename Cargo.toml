[workspace]
resolver = "3"
members = [
    "crates/apex-common",
    "crates/apex-provider",
    "crates/apex-tools",
    "crates/apex-agent",
    "crates/apex-workflow",
    "crates/apex-memory",
    "crates/apex-telemetry",
    "crates/apex-plugin",
    "crates/apex-marketplace",
    "crates/apex-tenancy",
    "crates/apex-events",
    "crates/apex-secrets",
    "crates/apex-audit",
    "crates/apex-kms",
    "crates/apex-server",
    "apps/apex-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/apex-ai/apex"

[workspace.dependencies]
# Internal crates
apex-common = { path = "crates/apex-common" }
apex-provider = { path = "crates/apex-provider" }
apex-tools = { path = "crates/apex-tools" }
apex-agent = { path = "crates/apex-agent" }
apex-workflow = { path = "crates/apex-workflow" }
apex-memory = { path = "crates/apex-memory" }
apex-telemetry = { path = "crates/apex-telemetry" }
apex-plugin = { path = "crates/apex-plugin" }
apex-marketplace = { path = "crates/apex-marketplace" }
apex-tenancy = { path = "crates/apex-tenancy" }
apex-events = { path = "crates/apex-events" }
apex-secrets = { path = "crates/apex-secrets" }
apex-audit = { path = "crates/apex-audit" }
apex-kms = { path = "crates/apex-kms" }
apex-server = { path = "crates/apex-server" }

# External
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
