[package]
name = "apex-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Plugin Engine: manifest, signature verification, permission grants, and the install/enable/disable lifecycle for extension capabilities."

[features]
# The WASM capability loader (`WasiCapabilityRuntime`). Off by default: it enables
# apex-tools' `wasi` backend, which pulls Wasmtime (a heavy dependency).
wasi = ["apex-tools/wasi"]
# A Rekor-backed `TransparencyLog` for keyless signing (ADR-0009). Off by default:
# pulls reqwest's blocking client. Live-tested against `deployment/rekor/`.
rekor = ["dep:reqwest"]

[dependencies]
apex-common.workspace = true
apex-tools.workspace = true
apex-secrets.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# ed25519 signature verification (already in the dep graph via rustls/ring).
ring = "0.17"
# Artifact content digests (sha256:...).
sha2 = "0.10"
# Platform-API compatibility ranges.
semver = "1"
# Rekor REST client (behind the `rekor` feature).
reqwest = { workspace = true, features = ["blocking"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# Assembles tiny WASI test modules from WAT in-process (cached: wat 1.x), so the
# WASM capability-loader tests need no external wasm toolchain.
wat = "1"
# Property/fuzz testing for the manifest YAML and `.apexpkg` envelope parsers
# (security-testing.md §8): arbitrary input must never panic.
proptest = "1"
