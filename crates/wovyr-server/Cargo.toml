[package]
name = "wovyr-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Single-node HTTP server exposing the Wovyr Platform API (v0.1: agent runs)."

[features]
# Execute plugin tool capabilities in the WASM sandbox (with secret injection) on the
# server's run path. Off by default (pulls Wasmtime via wovyr-plugin/wasi); without it,
# enabled plugin tools register but error on call (the not-loaded placeholder).
plugin-wasi = ["wovyr-plugin/wasi"]
# Postgres-backed marketplace registry: when `WOVYR_MARKETPLACE_POSTGRES_URL` is set,
# the marketplace routes share a durable catalog across server nodes instead of each
# holding its own `registry.json`. Off by default (pulls the `postgres` crate).
postgres = ["wovyr-marketplace/postgres"]
# Real local-model inference via mistral.rs as the server's gateway backend, selected
# with `WOVYR_PROVIDER=mistralrs` (see wovyr-provider's mistralrs_provider module for the
# model/env-var configuration this forwards to). Off by default (pulls the heavy
# mistral.rs inference engine and downloads real GGUF weights on first use); without
# this feature, `WOVYR_PROVIDER=mistralrs` logs a warning and falls back to
# `Gateway::from_env()`.
mistralrs = ["wovyr-provider/mistralrs"]
# Redis-shared rate limiting (RM-AIM-P2 SRV-201): with `WOVYR_RATE_LIMIT_REDIS_URL`
# set, a fleet of server nodes enforces one combined per-key request budget instead
# of N independent ones (degrading to per-node limits when Redis is unreachable).
# Off by default (pulls the redis client).
redis = ["dep:redis"]

[dependencies]
wovyr-common.workspace = true
wovyr-provider.workspace = true
wovyr-tools.workspace = true
wovyr-agent.workspace = true
wovyr-workflow.workspace = true
wovyr-runtime.workspace = true
wovyr-telemetry.workspace = true
wovyr-tenancy.workspace = true
wovyr-events.workspace = true
wovyr-secrets.workspace = true
wovyr-audit.workspace = true
wovyr-kms.workspace = true
wovyr-config.workspace = true
wovyr-memory.workspace = true
wovyr-ui.workspace = true
wovyr-ui-guard.workspace = true
wovyr-plugin.workspace = true
wovyr-marketplace.workspace = true
axum.workspace = true
# Generated OpenAPI spec (RM-AIM-P3 SRV-303): the served `/openapi.json` is derived
# from `#[utoipa::path]`-annotated handlers + `#[derive(ToSchema)]` request/response
# types, so it can't drift from the handlers the way a hand-maintained YAML file can.
utoipa = "5"
# `rt` for the timer/schedule dispatch loops, webhook delivery worker, and the
# marketplace registry's `spawn_blocking`; `time` for their sleeps; `net` for
# `serve()`'s listener (RM-GA-P4 HLTH-904); `signal` + `macros` for graceful-shutdown
# signal handling (SIGINT/SIGTERM via `tokio::select!`, RM-AIM-P1 SRV-101).
# (`sync` for the rate limiter's lazily-dialed shared-Redis connection slot, SRV-201.)
tokio = { workspace = true, features = ["rt", "time", "net", "signal", "macros", "sync"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
async-trait.workspace = true
reqwest.workspace = true
futures = "0.3"
semver.workspace = true
base64 = "0.22"
hex = "0.4"
sha2.workspace = true
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.8"
tower = { version = "0.5", features = ["util", "limit", "timeout", "load-shed"] }
tower-http = { version = "0.6", features = ["timeout", "limit", "cors"] }
# Explicitly no bundled crypto provider (tls-rustls-no-provider): reqwest elsewhere in
# this dependency graph already selects rustls' `ring` provider, and rustls panics at
# runtime if two providers (ring + aws-lc-rs, tls-rustls's default) are both linked in
# with neither installed as the process-wide default. `serve()` installs `ring`
# explicitly via the `rustls` dependency below before any TLS connection is accepted.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Same version/feature shape as wovyr-provider's redis dependency, plus `script` for
# the rate limiter's atomic Lua token bucket (SRV-201).
redis = { version = "0.24", default-features = false, features = ["tokio-comp", "script"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
rcgen = "0.13"
