[package]
name = "apex-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Durable workflow engine: DSL, event-sourced state machine, checkpointing, and retry."

[features]
# Postgres-backed durable event log + checkpoint store, for cross-process/node
# durable resume. Off by default (pulls tokio-postgres).
postgres = ["dep:tokio-postgres", "dep:refinery"]

[dependencies]
apex-common.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
# `rt` for the intra-workflow parallel-activity `JoinSet`; `time` for retry-backoff
# sleeps; `fs`/`io-util` for the file-backed event log/checkpoint/timer/schedule
# stores; `sync` for their in-process locks (RM-GA-P4 HLTH-904).
tokio = { workspace = true, features = ["rt", "time", "fs", "io-util", "sync"] }
tracing.workspace = true
tokio-postgres = { version = "0.7", optional = true }
# Versioned schema migrations (RM-GA-P3 MIG-A1): `apex admin migrate` applies
# `migrations/*.sql` via refinery; `PostgresStore::connect` only ever reads the
# resulting schema-version row, never runs DDL itself.
refinery = { version = "0.8", features = ["tokio-postgres"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
# Property/fuzz testing for the workflow DSL and cron-expression parsers
# (security-testing.md §8): arbitrary input must never panic.
proptest = "1"
