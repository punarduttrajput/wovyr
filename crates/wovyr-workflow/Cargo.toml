[package]
name = "wovyr-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Durable workflow engine: DSL, event-sourced state machine, checkpointing, and retry."

[features]
# Postgres-backed durable event log + checkpoint store, for cross-process/node
# durable resume. Off by default (pulls tokio-postgres + a rustls TLS stack for
# WFL-103's encrypted connections to a remote database).
postgres = [
    "dep:tokio-postgres",
    "dep:refinery",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:webpki-roots",
]

[dependencies]
wovyr-common.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true
# `rt` for the intra-workflow parallel-activity `JoinSet`; `time` for retry-backoff
# sleeps; `fs`/`io-util` for the file-backed event log/checkpoint/timer/schedule
# stores; `sync` for their in-process locks (RM-GA-P4 HLTH-904); `macros` for
# `tokio::select!`, driving an activity's execution concurrently with draining
# its progress-report channel (WFL-307).
tokio = { workspace = true, features = ["rt", "time", "fs", "io-util", "sync", "macros"] }
tracing.workspace = true
tokio-postgres = { version = "0.7", optional = true }
# Versioned schema migrations (RM-GA-P3 MIG-A1): `wovyr admin migrate` applies
# `migrations/*.sql` via refinery; `PostgresStore::connect` only ever reads the
# resulting schema-version row, never runs DDL itself.
refinery = { version = "0.8", features = ["tokio-postgres"], optional = true }
# TLS to a remote Postgres (WFL-103). `ring` provider (no aws-lc-rs) with the provider
# passed explicitly at config-build time, matching the rest of the workspace's rustls
# usage so no two crypto providers are ever linked without a process default installed.
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
# `macros` (for `#[tokio::test]`) is already pulled in by `[dependencies]`
# above — Cargo unions feature requests for the same crate across dependency
# sections, so no separate override is needed here anymore.
tokio = { workspace = true }
# Property/fuzz testing for the workflow DSL and cron-expression parsers
# (security-testing.md §8): arbitrary input must never panic.
proptest = "1"
