[package]
name = "apex-marketplace"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Plugin Marketplace registry: the hosted discovery, publishing, governance, and ratings surface over signed plugin packages."

[features]
# Run the supply-chain end-to-end test's *execute* step through the real WASM
# capability loader (`apex-plugin/wasi` → Wasmtime). Off by default (heavy compile);
# the publish→discover→download→install half of the E2E test always runs.
wasi = ["apex-plugin/wasi"]
# Postgres-backed `RegistryStore`, so a fleet of nodes (server processes, CLI
# invocations) share one durable catalog instead of each holding its own
# `registry.json`. Off by default (pulls the `postgres` crate). Uses the
# *synchronous* `postgres` crate (not `tokio-postgres`) since this whole crate is
# deliberately sync — see `src/postgres.rs`.
postgres = ["dep:postgres", "dep:refinery"]

[dependencies]
apex-common.workspace = true
apex-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# Package content-addressing (sha256 of the published `.apexpkg`).
sha2 = "0.10"
# Version sorting / channel resolution.
semver = "1"
# Synchronous Postgres client for the optional `postgres` feature.
postgres = { version = "0.19", optional = true }
# Versioned schema migrations (RM-GA-P3 MIG-A1): `apex admin migrate` applies
# `migrations/*.sql` via refinery; `connect` only ever reads the resulting
# schema-version row, never runs DDL itself. Sync variant (this crate is
# deliberately sync throughout — see the module doc in `src/postgres.rs`).
refinery = { version = "0.8", features = ["postgres"], optional = true }

[dev-dependencies]
# Produces signed test packages (ed25519) without an external toolchain.
ring = "0.17"
# Drive the engine's async capability runtime in the E2E test's execute step.
tokio = { workspace = true, features = ["macros", "rt"] }
# Names the tool registry/context/request types the engine's enable+execute path uses
# (the heavy `wasi` backend is pulled only when this crate's `wasi` feature is on).
apex-tools.workspace = true
