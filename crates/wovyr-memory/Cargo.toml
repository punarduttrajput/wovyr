[package]
name = "wovyr-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Memory engine: durable storage with hybrid (vector + keyword) retrieval and ranking."

[features]
# Tiered durable backends: a Postgres system-of-record + a Qdrant vector index.
# Off by default (pulls tokio-postgres + reqwest); enable to use TieredStore. Needs
# tokio's `rt`/`sync` for the backend's connection spawn + internal `Mutex`, wired
# here rather than the base `[dependencies]` tokio entry so a non-tiered build
# doesn't pay for it (RM-GA-P4 HLTH-904).
tiered = ["dep:tokio-postgres", "dep:reqwest", "dep:refinery", "tokio/rt", "tokio/sync"]

[dependencies]
wovyr-common.workspace = true
wovyr-provider.workspace = true
wovyr-kms.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
# `fs`/`io-util` for the file-backed store (RM-GA-P4 HLTH-904).
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
tokio-postgres = { version = "0.7", optional = true }
reqwest = { workspace = true, optional = true }
# Versioned schema migrations (RM-GA-P3 MIG-A1): `wovyr admin migrate` applies
# `migrations/*.sql` via refinery; `PostgresStore::connect` only ever reads the
# resulting schema-version row, never runs DDL itself.
refinery = { version = "0.8", features = ["tokio-postgres"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
