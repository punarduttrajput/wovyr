[package]
name = "apex-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Provider SDK and LLM gateway: a vendor-neutral chat interface for the Apex AI Platform."

[features]
# Redis-shared circuit-breaker state, so a fleet of gateways reacts to a failing
# provider consistently. Off by default (pulls the redis client).
redis = ["dep:redis"]
# Qdrant-backed distributed semantic cache (shared across a gateway fleet). Uses the
# reqwest client already in deps; off by default to keep the surface opt-in.
qdrant = []
# A real, local, offline LLM (mistral.rs) as an AIProvider backend. Off by default —
# pulls a large inference-engine dependency and, at runtime, downloads model weights.
# Deliberately not chained into Gateway::from_env()'s default resolution; a caller
# opts in explicitly via MistralRsProvider::from_env().
mistralrs = ["dep:mistralrs"]

[dependencies]
apex-common.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures = "0.3"
async-stream = "0.3"
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
redis = { version = "0.24", default-features = false, features = ["tokio-comp"], optional = true }
# Pure-Rust default features (no CUDA/Metal/MKL, no C compiler needed) — chosen
# deliberately for portability over this backend's max performance.
mistralrs = { version = "0.8", optional = true }

[[example]]
name = "mistralrs_research"
required-features = ["mistralrs"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# For the mistralrs_research example only (a dev-dependency cycle back to
# apex-provider is fine — Cargo excludes dev-deps from the graph it resolves
# for downstream consumers).
apex-agent.workspace = true
apex-tools.workspace = true
