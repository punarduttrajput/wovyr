[package]
name = "apex-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Provider SDK and LLM gateway: a vendor-neutral chat interface for the Apex AI Platform."

[features]
# Redis-shared circuit-breaker state, so a fleet of gateways reacts to a failing
# provider consistently. Off by default (pulls the redis client).
redis = ["dep:redis"]

[dependencies]
apex-common.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
redis = { version = "0.24", default-features = false, features = ["tokio-comp"], optional = true }

[dev-dependencies]
tokio.workspace = true
