[package]
name = "apex-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Deterministic, fixture-based AI evaluation harness (FUT-006 prototype spike) — not yet wired into CI, a CLI, or telemetry."

[features]
# A real, local, non-deterministic model (mistral.rs) as the comparison
# harness's provider, instead of a scripted deterministic one. Off by default —
# forwards to apex-provider's own off-by-default mistralrs feature.
mistralrs = ["apex-provider/mistralrs"]

[dependencies]
apex-common.workspace = true
apex-agent.workspace = true
apex-provider.workspace = true
apex-tools.workspace = true
apex-workflow.workspace = true
apex-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true }
