[package]
name = "apex-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Memory engine: durable storage with hybrid (vector + keyword) retrieval and ranking."

[features]
# Tiered durable backends: a Postgres system-of-record + a Qdrant vector index.
# Off by default (pulls tokio-postgres + reqwest); enable to use TieredStore.
tiered = ["dep:tokio-postgres", "dep:reqwest", "dep:refinery"]

[dependencies]
apex-common.workspace = true
apex-provider.workspace = true
apex-kms.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-postgres = { version = "0.7", optional = true }
reqwest = { workspace = true, optional = true }
# Versioned schema migrations (RM-GA-P3 MIG-A1): `apex admin migrate` applies
# `migrations/*.sql` via refinery; `PostgresStore::connect` only ever reads the
# resulting schema-version row, never runs DDL itself.
refinery = { version = "0.8", features = ["tokio-postgres"], optional = true }

[dev-dependencies]
tokio.workspace = true
