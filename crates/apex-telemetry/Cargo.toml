[package]
name = "apex-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Observability baseline: a Prometheus metrics registry and structured logging."

[features]
# OpenTelemetry OTLP trace export. Off by default (pulls the OTel SDK + gRPC stack);
# enable to export `tracing` spans to an OTLP collector via OTEL_EXPORTER_OTLP_ENDPOINT.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
