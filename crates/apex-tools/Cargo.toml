[package]
name = "apex-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Tool framework: the Tool trait, registry, and built-in tools for the Apex AI Platform."

[features]
# The WASI/WASM sandbox backend. Off by default: it pulls Wasmtime, a heavy
# dependency, so only builds/tests that exercise the backend pay the compile cost.
wasi = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasi-common"]

[dependencies]
apex-common.workspace = true
apex-provider.workspace = true
apex-secrets.workspace = true
apex-ui.workspace = true
apex-ui-guard.workspace = true
# `#[derive(Tool)]` (SBX-303) + the `schemars::JsonSchema` derive its generated
# `input_schema()` calls into — a tool author's params struct derives the schema
# instead of hand-writing a `json!({...})` literal.
apex-tool-macros.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
reqwest.workspace = true
# `net`/`io-util` for the egress proxy and DNS-pinned HTTP client; `fs` for sandbox
# workspace files; `process` for spawning sandboxed commands; `sync` for the sandbox
# pool's semaphore; `rt`/`time` for spawning the egress proxy task and command
# timeouts (RM-GA-P4 HLTH-904).
tokio = { workspace = true, features = ["net", "io-util", "fs", "process", "sync", "rt", "time"] }
tracing.workspace = true
# Pinned to 14.x to reuse the warm offline cache (wasmtime 14.0.4 is already vendored).
wasmtime = { version = "14", optional = true }
wasmtime-wasi = { version = "14", optional = true }
wasi-common = { version = "14", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows Job Object resource enforcement for the native sandbox (SBX-102), the
# non-Unix analog of the Unix `setrlimit` path. Pinned to 0.61 to reuse the version
# already in the tree (ring links it), so no new duplicate version / offline fetch.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
# Assembles tiny WASI test modules from WAT in-process, so the WASI tests need no
# external wasm toolchain (cached: wat 1.252).
wat = "1"
