[package]
name = "apex-kms"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Envelope-encryption key management: a root key wraps versioned tenant keys, tenant keys wrap per-use data encryption keys (DEKs)."

[dependencies]
apex-common.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# AEAD (AES-256-GCM) + secure randomness — already in the dep graph via apex-plugin's
# ed25519 signing, so this adds no new supply-chain surface.
ring.workspace = true
# Hex-encode wrapped key material for JSON persistence.
hex = { version = "0.4", features = ["serde"] }
