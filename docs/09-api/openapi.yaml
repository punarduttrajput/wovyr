openapi: 3.0.3
info:
  title: Wovyr AI Platform API
  version: "0.3.2"
  description: |
    The Wovyr single-node server's HTTP API, as actually implemented by
    `crates/wovyr-server` (not the aspirational conventions in `overview.md` —
    see the note below).

    ## This file is a snapshot, not the contract

    **The authoritative spec is the one the server generates and serves at
    `GET /openapi.json`** (RM-AIM-P3 SRV-303). That document is built at compile
    time from `#[utoipa::path]` annotations on the handlers themselves, and
    `served_spec_covers_every_mounted_route` fails the build if a mounted route
    has no annotation — so it cannot drift from the code. CI's `contract-gate`
    job lints *that* document and runs both SDK suites against a live server.

    This hand-maintained file is kept as a browsable, reviewable snapshot with
    prose that the generated document doesn't carry. It **can** drift, and has:
    the 2026-08-01 sync added 16 paths (`/openapi.json`, async run polling, KMS,
    generative UI, MCP connections, webhook dead-letters, and the marketplace
    abuse-report workflow) that had been live for milestones without being
    reflected here. When the two disagree, `/openapi.json` wins.

    `GET /workflows` — a minimal read-only HTML view of executions — is
    deliberately absent from both documents; it is a browser page, not an API.

    ## Divergence from `overview.md`

    `overview.md` describes a target-state convention (opaque `agt_01H...`
    ids, OAuth2/JWT/mTLS auth, a generic `/operations/{id}` polling resource,
    `RateLimit-*` headers, a uniform `{id, object, tenant, project,
    created_at, updated_at, version}` envelope on every resource). **None of
    that is implemented today.** The real API:

    - Identifies resources by their natural key (agent name, workflow
      `execution_id`, secret `name`, `publisher/name` for plugins/listings) —
      not a generated opaque id.
    - Authenticates via a verified `Authorization: Bearer <credential>`
      (RM-GA-P1 SEC-101, `crates/wovyr-server/src/auth.rs`): `WOVYR_AUTH_MODE=jwt`
      checks a JWT's signature (HS256/RS256) plus expiry/issuer/audience, or
      `apikey` looks up a SHA-256-hashed bearer token — either way the
      verified principal overwrites `X-Wovyr-Principal` before RBAC runs, so a
      client-asserted header alone can no longer win. No OAuth2 authorization
      flow or mTLS exists, and there is still no token-issuance endpoint (JWTs
      are minted by an external IdP; API keys are minted via
      `wovyr auth create-key`). The default `disabled-loopback` mode (no
      verification — a caller asserts any tenant/principal header) is a
      local-dev fallback, gated by an explicit `WOVYR_ALLOW_ANONYMOUS=1` that
      refuses to bind a non-loopback address; it is not the production
      posture. RBAC still only starts to matter once real memberships are
      registered for a tenant.
    - Has no generic long-running-operation resource; each async action
      (workflow submit, agent run) has its own polling/streaming shape.
    - Does implement: cursor pagination (`limit`/`cursor` → `{data, has_more,
      next_cursor, total_estimate}`), the `Idempotency-Key` header (RM-GA-P4
      API-703: every mutating route, not just `agents:run` — see each
      operation's `parameters` for which carry it; `workflows/validate` and
      `memory:query` are POST but not mutations, so they don't), `If-Match`/
      `ETag` optimistic concurrency (on projects only), and the `{error:
      {code, message, type, status, request_id}}` error envelope exactly as
      documented.
  contact:
    name: Wovyr AI Platform Team

servers:
  - url: http://127.0.0.1:8080
    description: Local `wovyr dev` single-node server

tags:
  - name: health
  - name: agents
  - name: workflows
  - name: memory
  - name: plugins
  - name: marketplace
  - name: secrets
  - name: kms
  - name: tenancy
  - name: webhooks
  - name: audit
  - name: tools
  - name: ui
  - name: mcp
  - name: system

components:
  securitySchemes:
    tenantHeader:
      type: apiKey
      in: header
      name: X-Wovyr-Tenant
      description: |
        The acting tenant. Defaults to `"default"` (anonymous/back-compat,
        unrestricted) if absent. Not cryptographically verified — this header
        is a claim, authorized against real memberships server-side.
    principalHeader:
      type: apiKey
      in: header
      name: X-Wovyr-Principal
      description: |
        The acting principal id, used verbatim only in the default
        `disabled-loopback` auth mode. When `bearerAuth` is configured
        (`WOVYR_AUTH_MODE=jwt|apikey`), the server overwrites this with the
        verified principal before any handler runs — a client-supplied value
        is then ignored, not merged.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        RM-GA-P1 SEC-101. Present only when the server is configured with
        `WOVYR_AUTH_MODE=jwt` (a signed JWT — HS256 via `WOVYR_JWT_HS_SECRET` or
        RS256 via `WOVYR_JWT_RS_PUBLIC_KEY`, `sub` claim becomes the principal)
        or `WOVYR_AUTH_MODE=apikey` (a bearer token minted via
        `wovyr auth create-key`, SHA-256-hashed server-side). The default
        `disabled-loopback` mode carries no bearer credential at all and
        instead trusts `X-Wovyr-Principal`/`X-Wovyr-Tenant` verbatim — a
        local-dev fallback the server refuses to expose on a non-loopback
        bind unless `WOVYR_ALLOW_ANONYMOUS=1` is set.

  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque pagination cursor from a previous response's `next_cursor`.
    xWovyrTenant:
      name: X-Wovyr-Tenant
      in: header
      schema: { type: string, default: default }
    xWovyrPrincipal:
      name: X-Wovyr-Principal
      in: header
      schema: { type: string }
    xWovyrProject:
      name: X-Wovyr-Project
      in: header
      schema: { type: string }
      description: In-scope project for run-path quota metering.
    idempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
      description: >-
        RM-GA-P4 API-703: a repeated key on this route replays the original
        (tenant, method, path, key)-scoped response instead of re-executing
        the mutation. Only a successful response is cached.
    ifMatch:
      name: If-Match
      in: header
      schema: { type: string }
      description: 'Optimistic-concurrency precondition. Accepts `"3"`, `W/"3"`, or bare `3`.'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, type, status, request_id]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            type: { type: string, enum: [client_error, server_error] }
            status: { type: integer }
            request_id: { type: string }

    PageMeta:
      type: object
      properties:
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }
        total_estimate: { type: integer }

    Usage:
      type: object
      properties:
        total_tokens: { type: integer }
        cost_usd: { type: number }

    RunRequest:
      type: object
      required: [manifest]
      properties:
        manifest: { type: string, description: Inline agent YAML manifest. }
        input: { description: Arbitrary JSON input passed to the agent. }
        max_steps: { type: integer, nullable: true }

    RunResult:
      type: object
      properties:
        run_id: { type: string }
        status: { type: string, enum: [succeeded] }
        output: { type: object, properties: { message: { type: string } } }
        steps: { type: integer }
        usage: { $ref: '#/components/schemas/Usage' }

    ScanReport:
      type: object
      properties:
        findings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              severity: { type: string, enum: [info, warning, critical] }
              message: { type: string }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  # ---------------------------------------------------------------- health --
  /healthz:
    get:
      tags: [health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string }, version: { type: string } }

  /metrics:
    get:
      tags: [health]
      summary: Prometheus/OpenMetrics scrape endpoint
      description: "Returns OpenMetrics text if the request sends an Accept header of application/openmetrics-text, else classic Prometheus text."
      security: []
      responses:
        '200':
          description: Metrics text
          content:
            text/plain: { schema: { type: string } }

  /openapi.json:
    get:
      tags: [system]
      summary: The generated OpenAPI document — the authoritative API contract
      description: >-
        RM-AIM-P3 SRV-303. Generated at compile time from the handlers'
        `#[utoipa::path]` annotations, so it cannot drift from the code.
        Unauthenticated, alongside `/healthz` and `/metrics`, since it describes
        the API's shape rather than any tenant's data.
      security: []
      responses:
        '200':
          description: This document.
          content:
            application/json: { schema: { type: object } }

  # --------------------------------------------------------------- agents --
  /api/v1/agents:run:
    post:
      tags: [agents]
      summary: Run an inline agent manifest (no persistence)
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrProject'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RunRequest' } }
      responses:
        '200':
          description: Run result
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunResult' } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/agents:stream:
    post:
      tags: [agents]
      summary: Run an inline agent manifest, streaming progress via SSE
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrProject'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RunRequest' } }
      responses:
        '200':
          description: |
            `text/event-stream`. Unnamed `data:` frames in order:
            `{"type":"start",...}`, optional `{"type":"memory",...}`,
            repeated `{"type":"delta","text":...}`, optional
            `{"type":"reasoning","text":...}` (the model's thinking channel,
            where the provider exposes one) and
            `{"type":"tool_call_delta","index":...,"name":...,"arguments":...}`
            (incremental argument fragments as the model composes a call),
            optional `{"type":"tool_call",...}`/`{"type":"tool_result",...}`,
            `{"type":"done","usage":{...}}`. Terminal **named** event
            `event: result` (`data`: run result) or `event: error` (plain-text
            data). Consumers should ignore frame types they don't recognize.
          content:
            text/event-stream: { schema: { type: string } }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/agents:
    get:
      tags: [agents]
      summary: List stored agents (ids only) for the caller's tenant
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated agent ids
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: string } } }
    post:
      tags: [agents]
      summary: Store an agent manifest
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties: { manifest: { type: string } }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, status: { type: string, enum: [created] } }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/xWovyrTenant'
      - $ref: '#/components/parameters/xWovyrPrincipal'
    get:
      tags: [agents]
      summary: Fetch a stored agent's manifest
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, manifest: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [agents]
      summary: Delete a stored agent
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/agents/{id}/run:
    post:
      tags: [agents]
      summary: Run a stored agent by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/xWovyrProject'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { input: {}, max_steps: { type: integer, nullable: true } }
      responses:
        '200':
          description: Run result
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunResult' } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/agents/runs/{run_id}:
    get:
      tags: [agents]
      summary: Poll an asynchronously-submitted agent run
      description: >-
        RM-GA-P2 EXE-604. A run submitted to `agents:run` (or
        `agents/{id}/run`) with the RFC 7240 header `Prefer: respond-async`
        returns `{run_id, status: "running"}` immediately; this polls it.
        Tenant-scoped exactly like every other run-adjacent route — a
        mismatched tenant gets the same `404` as an unknown id, never a `403`
        that would confirm the id exists. Records are durable
        (`~/.wovyr/server/async_runs.json`); a run still `running` when the
        server restarts is reconciled to a terminal `failed`, since a bare
        agent run has no checkpoint to resume from.
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
          description: The `run_id` returned by an async submission.
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: The run's current status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  status: { type: string, enum: [running, succeeded, failed] }
                  output: { type: object, nullable: true }
                  error: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------ workflows --
  /api/v1/workflows/validate:
    post:
      tags: [workflows]
      summary: Parse and validate a workflow DSL manifest (no side effects)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties: { manifest: { type: string } }
      responses:
        '200':
          description: Parsed definition summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  name: { type: string }
                  version: { type: string }
                  activities:
                    type: array
                    items:
                      type: object
                      properties: { id: { type: string }, type: { type: string }, name: { type: string } }
                  edges:
                    type: array
                    items:
                      type: object
                      properties: { from: { type: string }, to: { type: string }, when: { type: string, nullable: true } }
                  activity_count: { type: integer }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/workflows:
    get:
      tags: [workflows]
      summary: List workflow executions visible to the caller's tenant
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: workflow
          in: query
          schema: { type: string }
          description: Filter by workflow name.
        - name: status
          in: query
          schema:
            type: string
            enum: [created, validated, scheduled, running, waiting, resumed, compensating, completed, failed, cancelled]
      responses:
        '200':
          description: Paginated execution summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [workflows]
      summary: Submit (durably start + async-drive) a workflow execution
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: string }
                input: {}
                execution_id: { type: string, nullable: true, description: 'Auto-generated `<workflow-name>-<n>` if omitted.' }
      responses:
        '200':
          description: Submitted (does not wait for completion — poll `GET /api/v1/workflows/{id}`)
          content:
            application/json:
              schema:
                type: object
                properties: { execution_id: { type: string }, status: { type: string, enum: [submitted] } }

  /api/v1/workflows/{id}:
    get:
      tags: [workflows]
      summary: Get an execution's live status + event history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: Execution + events
          content:
            application/json:
              schema:
                type: object
                properties: { execution: { type: object }, events: { type: array, items: { type: object } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [workflows]
      summary: Cancel an execution (advisory — in-flight activities still complete)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '202': { description: Cancellation accepted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/workflows/{id}/signal:
    post:
      tags: [workflows]
      summary: Deliver an event to a `wait` activity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, event]
              properties: { manifest: { type: string }, event: { type: string }, payload: {} }
      responses:
        '200':
          description: Signalled
          content:
            application/json:
              schema:
                type: object
                properties: { execution_id: { type: string }, event: { type: string }, status: { type: string, enum: [signalled] } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/workflows/{id}/approve:
    post:
      tags: [workflows]
      summary: Resume a suspended human-approval activity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, activity_id]
              properties:
                manifest: { type: string }
                activity_id: { type: string }
                decision: { description: 'Defaults to `{"approved": true}` if omitted.' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties: { execution_id: { type: string }, activity_id: { type: string }, status: { type: string, enum: [approved] } }
        '404': { $ref: '#/components/responses/Error' }

  # --------------------------------------------------------------- memory --
  /api/v1/memory/namespaces:
    get:
      tags: [memory]
      summary: List memory namespaces (with record counts) for the caller's tenant
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: Namespaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces:
                    type: array
                    items:
                      type: object
                      properties: { namespace: { type: string }, count: { type: integer } }
                  total: { type: integer }

  /api/v1/memory/records:
    get:
      tags: [memory]
      summary: List memory records (newest first)
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: namespace
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [memory]
      summary: Store a memory record
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, content]
              properties:
                namespace: { type: string }
                content: { type: string }
                type: { type: string, enum: [semantic, conversation, workflow, episodic], default: semantic }
                importance: { type: number, minimum: 0, maximum: 1, default: 0.5 }
                tags: { type: array, items: { type: string }, default: [] }
                required_scopes:
                  type: array
                  items: { type: string }
                  default: []
                  description: 'Any client-supplied `tenant:` scope is stripped; the server appends its own.'
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, status: { type: string, enum: [stored] } }

  /api/v1/memory:query:
    post:
      tags: [memory]
      summary: Hybrid (vector + keyword) memory retrieval
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                namespace: { type: string, nullable: true }
                strategy: { type: string, enum: [vector, keyword, hybrid], default: hybrid }
                limit: { type: integer, nullable: true }
                diversity:
                  type: number
                  nullable: true
                  minimum: 0
                  maximum: 1
                  description: MMR diversification lambda.
                min_importance: { type: number, nullable: true }
                tags: { type: array, items: { type: string }, nullable: true }
                grants:
                  type: array
                  items: { type: string }
                  nullable: true
                  description: 'ABAC grants; client-supplied `tenant:` scopes are stripped.'
                relevance: { type: number, nullable: true }
                recency: { type: number, nullable: true }
                importance: { type: number, nullable: true }
      responses:
        '200':
          description: >-
            Query results — a ranked result set, not a page (no
            cursor/has_more; retrieval is bounded by limit/relevance, not an
            offset into a stable ordering).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        namespace: { type: string }
                        content: { type: string }
                        type: { type: string }
                        importance: { type: number }
                        tags: { type: array, items: { type: string } }
                        score: { type: number }
                        breakdown:
                          type: object
                          properties:
                            relevance: { type: number }
                            recency: { type: number }
                            importance: { type: number }
                            total: { type: number }
                  count: { type: integer }

  # -------------------------------------------------------------- plugins --
  /api/v1/plugins:
    get:
      tags: [plugins]
      summary: List installed plugins
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated installed plugins
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, description: 'publisher/name' }
                            name: { type: string }
                            version: { type: string }
                            publisher: { type: string }
                            description: { type: string }
                            state: { type: string, enum: [enabled, disabled] }
                            permissions: { type: array, items: { type: string } }
                            granted: { type: array, items: { type: string } }
                            capabilities:
                              type: array
                              items:
                                type: object
                                properties:
                                  kind: { type: string, enum: [tool, provider, memory_backend, policy, workflow_activity] }
                                  id: { type: string }
                            platform_api: { type: string }

  /api/v1/plugins:install:
    post:
      tags: [plugins]
      summary: Install a signed `.wovyrpkg` (verified + staged, registered disabled)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wovyrpkg]
              properties:
                wovyrpkg: { type: string, format: byte, description: base64-encoded .wovyrpkg }
                grants: { type: array, items: { type: string }, default: [] }
      responses:
        '200': { description: Installed (disabled) }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/plugins:enable:
    post:
      tags: [plugins]
      summary: Enable an installed plugin
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200': { description: Enabled }

  /api/v1/plugins:disable:
    post:
      tags: [plugins]
      summary: Disable an installed plugin
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200': { description: Disabled }

  /api/v1/plugins:upgrade:
    post:
      tags: [plugins]
      summary: Upgrade an installed plugin to a new signed package
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wovyrpkg]
              properties:
                wovyrpkg: { type: string, format: byte }
                grants: { type: array, items: { type: string }, default: [] }
      responses:
        '200': { description: Upgraded }

  /api/v1/plugins:rollback:
    post:
      tags: [plugins]
      summary: Roll back a plugin to its previous version
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200': { description: Rolled back }

  /api/v1/plugins:trust:
    post:
      tags: [plugins]
      summary: Register a publisher's ed25519 public key
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publisher, public_key_hex]
              properties:
                publisher: { type: string }
                public_key_hex: { type: string, description: 64 hex chars (32-byte ed25519 key). }
      responses:
        '200': { description: Trusted }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/plugins/{id}:
    delete:
      tags: [plugins]
      summary: Uninstall a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded `publisher/name`.
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: Uninstalled }

  # ----------------------------------------------------------- marketplace --
  /api/v1/marketplace/listings:
    get:
      tags: [marketplace]
      summary: Search/browse marketplace listings
      parameters:
        - name: q
          in: query
          schema: { type: string, default: '' }
        - name: category
          in: query
          schema: { type: string }
        - name: capability
          in: query
          schema: { type: string, enum: [tool, provider, memory_backend, policy, workflow_activity] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }

  /api/v1/marketplace:publish:
    post:
      tags: [marketplace]
      summary: Publish a signed package to the registry
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wovyrpkg]
              properties:
                wovyrpkg: { type: string, format: byte }
                categories: { type: array, items: { type: string }, default: [] }
                channel: { type: string, default: stable }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing: { type: string }
                  reference: { type: string }
                  channel: { type: string }
                  status: { type: string, enum: [published] }
                  scan: { $ref: '#/components/schemas/ScanReport' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/marketplace/listings/{id}:
    get:
      tags: [marketplace]
      summary: Get one listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded `publisher/name`.
      responses:
        '200': { description: Listing }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/marketplace/listings/{id}/download:
    get:
      tags: [marketplace]
      summary: Download a version's `.wovyrpkg` bytes (base64)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          schema: { type: string }
          description: Defaults to the latest stable-channel version.
      responses:
        '200':
          description: Package bytes
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, wovyrpkg: { type: string, format: byte } }

  /api/v1/marketplace/listings/{id}/attestation:
    get:
      tags: [marketplace]
      summary: Live supply-chain attestation for a version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Attestation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  version: { type: string }
                  publisher: { type: string }
                  verified: { type: boolean }
                  signature_verified: { type: boolean }
                  risk: { type: string, enum: [low, medium, high] }
                  permissions: { type: array, items: { type: string } }
                  package_digest: { type: string }
                  sbom: { type: array, items: { type: object }, nullable: true }
                  provenance: { type: object, nullable: true }
                  scan: { $ref: '#/components/schemas/ScanReport' }

  /api/v1/marketplace/listings/{id}/reviews:
    post:
      tags: [marketplace]
      summary: Add a 1-5 star review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author, rating]
              properties:
                author: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string, default: '' }
      responses:
        '200': { description: Reviewed }

  /api/v1/marketplace/listings/{id}/verify:
    post:
      tags: [marketplace]
      summary: Operator override — set the verified badge directly (bypasses the review workflow)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { verified: { type: boolean, default: true } }
      responses:
        '200': { description: Updated }

  /api/v1/marketplace/listings/{id}/request-review:
    post:
      tags: [marketplace]
      summary: Publisher requests human review of the current latest version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: Pending
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, status: { type: string, enum: [pending] } }

  /api/v1/marketplace/listings/{id}/approve:
    post:
      tags: [marketplace]
      summary: Reviewer approves the pending review (sets the verified badge)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reviewer: { type: string, nullable: true } }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, verified: { type: boolean }, reviewer: { type: string } }

  /api/v1/marketplace/listings/{id}/reject:
    post:
      tags: [marketplace]
      summary: Reviewer rejects the pending review with actionable feedback
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reviewer: { type: string, nullable: true }, reason: { type: string } }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, verified: { type: boolean }, reviewer: { type: string }, reason: { type: string } }

  /api/v1/marketplace/listings/{id}/install:
    post:
      tags: [marketplace]
      summary: Download a listed package and install it locally (disabled)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, nullable: true }
                grants: { type: array, items: { type: string }, default: [] }
      responses:
        '200': { description: Installed }

  /api/v1/marketplace/listings/{id}/report:
    post:
      tags: [marketplace]
      summary: File an abuse report against a listing
      description: >-
        Any principal may report (malware, IP infringement, deceptive
        metadata). Report ids are sequential per listing. Emits
        `plugin.abuse_reported`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded `publisher/name`.
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                reporter:
                  type: string
                  nullable: true
                  description: Falls back to `X-Wovyr-Principal`, else `anonymous`.
      responses:
        '200': { description: 'Abuse report filed (status: open).' }

  /api/v1/marketplace/listings/{id}/reports:
    get:
      tags: [marketplace]
      summary: List the abuse reports filed against a listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded `publisher/name`.
      responses:
        '200':
          description: The listing's filed abuse reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports: { type: array, items: { type: object } }

  /api/v1/marketplace/listings/{id}/reports/{report_id}/resolve:
    post:
      tags: [marketplace]
      summary: Resolve an open abuse report as valid, optionally delisting
      description: >-
        `marketplace:moderate`-gated (SEC-104). Delisting hides the listing from
        search/get and refuses download — a dynamic moderation decision, distinct
        from a static operator blocklist entry. Emits `plugin.delisted`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded `publisher/name`.
        - name: report_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                moderator: { type: string, nullable: true }
                delist: { type: boolean, default: false }
                resolution: { type: string, nullable: true }
      responses:
        '200': { description: Report resolved. }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/marketplace/listings/{id}/reports/{report_id}/dismiss:
    post:
      tags: [marketplace]
      summary: Dismiss an open abuse report as not actionable
      description: '`marketplace:moderate`-gated (SEC-104).'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded `publisher/name`.
        - name: report_id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                moderator: { type: string, nullable: true }
      responses:
        '200': { description: Report dismissed. }
        '403': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------secrets --
  /api/v1/secrets:
    get:
      tags: [secrets]
      summary: List secret metadata (never values) for the caller's tenant
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated secret metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [secrets]
      summary: Create a secret
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties: { name: { type: string }, value: { type: string } }
      responses:
        '200':
          description: Created (metadata only — value never returned)
          content:
            application/json: { schema: { type: object } }

  /api/v1/secrets/{name}:
    get:
      tags: [secrets]
      summary: Get one secret's metadata
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200': { description: Metadata }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [secrets]
      summary: Delete a secret
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/secrets/{name}/rotate:
    post:
      tags: [secrets]
      summary: Rotate a secret's value (retains one previous version)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [value], properties: { value: { type: string } } }
      responses:
        '200': { description: Rotated (metadata only) }

  # -------------------------------------------------------------- tenancy --
  /api/v1/organizations:
    get:
      tags: [tenancy]
      summary: List organizations
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated organizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [tenancy]
      summary: Create an organization
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/projects:
    get:
      tags: [tenancy]
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [tenancy]
      summary: Create a project
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, organization]
              properties: { name: { type: string }, organization: { type: string } }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}:
    get:
      tags: [tenancy]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: Project
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [tenancy]
      summary: Partially update a project (settings/status)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/ifMatch'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings: { type: object, nullable: true, additionalProperties: true }
                status: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { schema: { type: string } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [tenancy]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '204': { description: Deleted }

  /api/v1/projects/{id}/members:
    get:
      tags: [tenancy]
      summary: List a project's members
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema: { type: object, properties: { members: { type: array, items: { type: object } } } }
    post:
      tags: [tenancy]
      summary: Add a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, role]
              properties:
                user: { type: string }
                role: { type: string, enum: [viewer, editor, project_admin, org_admin, platform_admin] }
      responses:
        '201': { description: Added }

  /api/v1/projects/{id}/members/{uid}:
    delete:
      tags: [tenancy]
      summary: Remove a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: uid
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '204': { description: Removed }

  /api/v1/projects/{id}/quota:
    get:
      tags: [tenancy]
      summary: Get a project's quota limits
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: Quota
          content:
            application/json:
              schema:
                type: object
                properties: { scope: { type: string, enum: [project] }, limits: { type: object } }
    patch:
      tags: [tenancy]
      summary: Update a project's quota limits (org.admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                concurrent_agent_runs: { type: integer, nullable: true }
                llm_cost_per_day_usd: { type: number, nullable: true }
                llm_tokens_per_day:
                  type: integer
                  nullable: true
                  description: >-
                    Max LLM tokens (prompt + completion) per rolling day
                    (SRV-202) — the vendor-bill-independent twin of
                    llm_cost_per_day_usd.
                day_reset_offset_minutes:
                  type: integer
                  nullable: true
                  description: >-
                    Where this quota's daily budgets reset, in minutes east of
                    UTC (SRV-203) — e.g. 330 resets at 00:00 IST, -300 at
                    00:00 EST. Absent/null = UTC midnight. Clamped to ±1440.
      responses:
        '200':
          description: Updated quota
          content:
            application/json:
              schema:
                type: object
                properties: { scope: { type: string, enum: [project] }, limits: { type: object } }

  # -------------------------------------------------------------webhooks --
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      summary: List registered webhooks (secrets redacted)
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated webhooks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [webhooks]
      summary: Register a webhook subscription
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events, secret]
              properties:
                url: { type: string }
                events:
                  type: array
                  items: { type: string }
                  description: 'Wildcard topics supported (`*`, `plugin.*`) or an exact event type.'
                secret: { type: string }
      responses:
        '201': { description: Registered }

  /api/v1/webhooks/dead-letters:
    get:
      tags: [webhooks]
      summary: List deliveries that exhausted their retry budget
      description: >-
        RM-AIM-P1 SRV-103. The durable outbox dead-letters a delivery once its
        backoff retries are exhausted, so a permanently-failing endpoint is
        queryable rather than lost to a log. Tenant-scoped; signing secrets are
        never included.
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: A paginated list of dead-lettered deliveries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { type: object } }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/webhooks/{id}:
    delete:
      tags: [webhooks]
      summary: Remove a webhook subscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '204': { description: Removed }

  # ---------------------------------------------------------------- audit --
  /api/v1/audit:
    get:
      tags: [audit]
      summary: Query the tamper-evident audit log (tenant-scoped), most-recent first
      description: >-
        Served from a bounded backward scan of the log (SEC-301), so
        `total_estimate` is always `null` on this route specifically — an exact
        count would require the full-log scan the bounded paging exists to avoid.
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - name: principal
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: after_ms
          in: query
          description: Only entries at or after this epoch-ms timestamp (inclusive).
          schema: { type: integer, format: int64 }
        - name: before_ms
          in: query
          description: Only entries at or before this epoch-ms timestamp (inclusive).
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated audit entries (`total_estimate` always `null` here)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }
                  has_more: { type: boolean }
                  next_cursor: { type: string, nullable: true }
                  total_estimate: { type: integer, nullable: true }

  # ---------------------------------------------------------------- tools --
  /api/v1/tools:
    get:
      tags: [tools]
      summary: List available tools (built-ins + enabled plugin tools)
      security: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated tools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            description: { type: string }
                            category: { type: string }
                            permissions: { type: array, items: { type: string }, nullable: true }

  # ------------------------------------------------------------------ kms --
  /api/v1/kms/tenant-key/rotate:
    post:
      tags: [kms]
      summary: Roll a new tenant-key version
      description: >-
        Routine (`kms:write`). Old versions are retained, so data already
        wrapped under them stays valid — nothing is re-encrypted. Audited as
        `kms.tenant_key.rotate`, referenced by tenant and never by key material.
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: New tenant-key version rolled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { type: string }
                  version: { type: integer }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/kms/tenant-key/destroy:
    post:
      tags: [kms]
      summary: Crypto-shred a tenant's key material (IRREVERSIBLE)
      description: >-
        Gated on `kms:admin`, a materially higher tier than routine writes: this
        permanently destroys the tenant's key material, so every secret and
        sensitive memory ever sealed under it becomes unrecoverable and the
        tenant fails closed on any further KMS operation. Audited as
        `kms.tenant_key.destroy`.
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200': { description: 'Tenant key destroyed (crypto-shred, irreversible).' }
        '403': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------------- ui --
  /api/v1/ui/present:
    post:
      tags: [ui]
      summary: Present a generative-UI frame through the trust layer
      description: >-
        PRD-005 EMB-701 — standalone middleware mode: runs the identical trust
        layer as the workflow `ui` activity with no workflow or agent adoption.
        The frame is parsed fail-closed, judged against the tenant's `UiPolicy`
        (default `hosted_floor`: display-only frames pass, interactive frames
        are denied), audited, and persisted pending a decision. Requires
        `ui:write`.
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frame]
              properties:
                frame:
                  type: object
                  description: A `UiFrame` document (see `crates/wovyr-ui`).
      responses:
        '200': { description: The frame passed the trust layer and is now pending a decision. }
        '400': { $ref: '#/components/responses/Error' }
        '403':
          description: The trust layer blocked the frame (the fired rule id is in the error).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ui/frames:
    get:
      tags: [ui]
      summary: List pending validated frames awaiting a decision
      description: Tenant-scoped. Requires `ui:read`.
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: Pending validated frames, tenant-scoped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object } }

  /api/v1/ui/frames/{frame_id}:
    get:
      tags: [ui]
      summary: Fetch one pending validated frame
      parameters:
        - name: frame_id
          in: path
          required: true
          schema: { type: string }
          description: 'The pending frame id (`uif-…`).'
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: The pending validated frame, including its `frame_hash`.
          content:
            application/json: { schema: { type: object } }
        '404':
          description: Unknown frame, or not the caller's tenant's (indistinguishable by design).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ui/decisions/{frame_id}:
    post:
      tags: [ui]
      summary: Submit a decision for a pending frame
      description: >-
        HIL-302/303. The decision is validated at the boundary against the frame
        itself — an undeclared action, unknown value keys, or a constraint
        violation all `400` without touching the workflow. A valid decision is
        stamped with `decided_by`/`decided_at_ms`/`frame_hash`, audited as
        `ui.decision.submit`, and then either resumes the owning workflow
        execution or (for a standalone frame) is recorded for later retrieval.
        Requires `ui:write`.
      parameters:
        - name: frame_id
          in: path
          required: true
          schema: { type: string }
          description: 'The pending frame id (`uif-…`).'
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, description: An action id declared by the frame. }
                values:
                  type: object
                  description: Values for the frame's declared inputs.
      responses:
        '200': { description: 'Decision accepted; execution resumed, or recorded for a standalone frame.' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    get:
      tags: [ui]
      summary: Retrieve the recorded decision for a standalone frame
      description: >-
        Standalone (EMB-701) frames only — a workflow-backed frame's decision
        lives in its execution's activity output, not here. Requires `ui:read`.
      parameters:
        - name: frame_id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: The recorded decision.
          content:
            application/json: { schema: { type: object } }
        '404':
          description: No recorded decision — unknown, still pending, workflow-backed, or another tenant's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------ mcp --
  /api/v1/mcp/connections:
    post:
      tags: [mcp]
      summary: Create a user-managed MCP connection
      description: >-
        PRD-006 / ADR-0012. The connection is dialed and verified before it is
        persisted, and its discovered tools are returned. Credentials are stored
        as a `secret://` reference, never inline. A `Stdio` transport is
        arbitrary local command execution and therefore needs **both** the
        `mcp:admin` scope and the operator opt-in `WOVYR_ENABLE_MCP_STDIO=1`;
        `Http` needs `mcp:write` and reuses `http_get`'s SEC-304 SSRF guard.
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, transport]
              properties:
                name: { type: string, description: Unique per tenant; namespaces the proxied tool ids. }
                transport:
                  type: object
                  description: 'Either `{"http": {"url": "..."}}` or `{"stdio": {"command": "...", "args": [...]}}`.'
                secret_ref:
                  type: string
                  nullable: true
                  description: 'A `secret://<namespace>/<name>` reference resolved at call time.'
      responses:
        '200': { description: 'Verified and persisted; discovered tools included.' }
        '400': { $ref: '#/components/responses/Error' }
        '403':
          description: Missing scope, or `Stdio` requested without the operator opt-in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: The tenant's `max_mcp_connections` quota would be exceeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/Error' }
    get:
      tags: [mcp]
      summary: List the tenant's configured MCP connections
      description: >-
        Requires `mcp:read`. The envelope also carries a `stdio_enabled` flag
        (RM-MCX-P3-302) so a UI can hide the `Stdio` option before a form is
        filled out rather than after a rejected submit.
      parameters:
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: The tenant's connections, plus a capability flag.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data: { type: array, items: { type: object } }
                      stdio_enabled: { type: boolean }

  /api/v1/mcp/connections/{name}:
    get:
      tags: [mcp]
      summary: Fetch one connection's configuration
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
      responses:
        '200':
          description: The connection's configuration (never a resolved credential).
          content:
            application/json: { schema: { type: object } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [mcp]
      summary: Delete a connection
      description: Deleting a `Stdio` connection requires `mcp:admin`.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/mcp/connections/{name}/refresh:
    post:
      tags: [mcp]
      summary: Re-discover a connection's tools
      description: Refreshing a `Stdio` connection requires `mcp:admin`.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xWovyrTenant'
        - $ref: '#/components/parameters/xWovyrPrincipal'
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          description: The connection's freshly re-discovered tools.
          content:
            application/json: { schema: { type: object } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

security:
  # Alternatives (a client uses whichever the server is actually configured
  # for — `WOVYR_AUTH_MODE`): the local-dev default (raw, unverified headers),
  # or a verified bearer credential (RM-GA-P1 SEC-101) alongside the tenant
  # header (still asserted, but authorized against real memberships).
  - tenantHeader: []
    principalHeader: []
  - tenantHeader: []
    bearerAuth: []
