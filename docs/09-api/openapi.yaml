openapi: 3.0.3
info:
  title: Apex AI Platform API
  version: "0.1.0"
  description: |
    The Apex single-node server's HTTP API, as actually implemented by
    `crates/apex-server` (not the aspirational conventions in `overview.md` —
    see the note below). Source of truth: this spec is generated by hand from
    the Axum route handlers, kept in sync manually until a codegen pipeline
    exists.

    ## Divergence from `overview.md`

    `overview.md` describes a target-state convention (opaque `agt_01H...`
    ids, OAuth2/JWT/mTLS auth, a generic `/operations/{id}` polling resource,
    `RateLimit-*` headers, a uniform `{id, object, tenant, project,
    created_at, updated_at, version}` envelope on every resource). **None of
    that is implemented today.** The real API:

    - Identifies resources by their natural key (agent name, workflow
      `execution_id`, secret `name`, `publisher/name` for plugins/listings) —
      not a generated opaque id.
    - Authenticates via plain request headers (`X-Apex-Tenant`,
      `X-Apex-Principal`), not OAuth2/JWT/mTLS. There is no token issuance or
      validation endpoint. Anyone who can reach the server can assert any
      tenant/principal header; RBAC only starts to matter once real
      memberships are registered for that tenant.
    - Has no generic long-running-operation resource; each async action
      (workflow submit, agent run) has its own polling/streaming shape.
    - Does implement: cursor pagination (`limit`/`cursor` → `{data, has_more,
      next_cursor, total_estimate}`), the `Idempotency-Key` header (on
      `agents:run` only), `If-Match`/`ETag` optimistic concurrency (on
      projects only), and the `{error: {code, message, type, status,
      request_id}}` error envelope exactly as documented.
  contact:
    name: Apex AI Platform Team

servers:
  - url: http://127.0.0.1:8080
    description: Local `apex dev` single-node server

tags:
  - name: health
  - name: agents
  - name: workflows
  - name: memory
  - name: plugins
  - name: marketplace
  - name: secrets
  - name: tenancy
  - name: webhooks
  - name: audit
  - name: tools

components:
  securitySchemes:
    tenantHeader:
      type: apiKey
      in: header
      name: X-Apex-Tenant
      description: |
        The acting tenant. Defaults to `"default"` (anonymous/back-compat,
        unrestricted) if absent. Not cryptographically verified — this header
        is a claim, authorized against real memberships server-side.
    principalHeader:
      type: apiKey
      in: header
      name: X-Apex-Principal
      description: |
        The acting principal id. Falls back to the `Authorization: Bearer
        <token>` value verbatim (as an opaque principal string, not a
        validated token) if absent.

  parameters:
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque pagination cursor from a previous response's `next_cursor`.
    xApexTenant:
      name: X-Apex-Tenant
      in: header
      schema: { type: string, default: default }
    xApexPrincipal:
      name: X-Apex-Principal
      in: header
      schema: { type: string }
    xApexProject:
      name: X-Apex-Project
      in: header
      schema: { type: string }
      description: In-scope project for run-path quota metering.
    idempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
    ifMatch:
      name: If-Match
      in: header
      schema: { type: string }
      description: 'Optimistic-concurrency precondition. Accepts `"3"`, `W/"3"`, or bare `3`.'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, type, status, request_id]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            type: { type: string, enum: [client_error, server_error] }
            status: { type: integer }
            request_id: { type: string }

    PageMeta:
      type: object
      properties:
        has_more: { type: boolean }
        next_cursor: { type: string, nullable: true }
        total_estimate: { type: integer }

    Usage:
      type: object
      properties:
        total_tokens: { type: integer }
        cost_usd: { type: number }

    RunRequest:
      type: object
      required: [manifest]
      properties:
        manifest: { type: string, description: Inline agent YAML manifest. }
        input: { description: Arbitrary JSON input passed to the agent. }
        max_steps: { type: integer, nullable: true }

    RunResult:
      type: object
      properties:
        run_id: { type: string }
        status: { type: string, enum: [succeeded] }
        output: { type: object, properties: { message: { type: string } } }
        steps: { type: integer }
        usage: { $ref: '#/components/schemas/Usage' }

    ScanReport:
      type: object
      properties:
        findings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              severity: { type: string, enum: [info, warning, critical] }
              message: { type: string }

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  # ---------------------------------------------------------------- health --
  /healthz:
    get:
      tags: [health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string }, version: { type: string } }

  /metrics:
    get:
      tags: [health]
      summary: Prometheus/OpenMetrics scrape endpoint
      description: "Returns OpenMetrics text if the request sends an Accept header of application/openmetrics-text, else classic Prometheus text."
      security: []
      responses:
        '200':
          description: Metrics text
          content:
            text/plain: { schema: { type: string } }

  # --------------------------------------------------------------- agents --
  /api/v1/agents:run:
    post:
      tags: [agents]
      summary: Run an inline agent manifest (no persistence)
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexProject'
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RunRequest' } }
      responses:
        '200':
          description: Run result
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunResult' } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/agents:stream:
    post:
      tags: [agents]
      summary: Run an inline agent manifest, streaming progress via SSE
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexProject'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RunRequest' } }
      responses:
        '200':
          description: |
            `text/event-stream`. Unnamed `data:` frames in order:
            `{"type":"start",...}`, optional `{"type":"memory",...}`,
            repeated `{"type":"delta","text":...}`, optional
            `{"type":"tool_call",...}`/`{"type":"tool_result",...}`,
            `{"type":"done","usage":{...}}`. Terminal **named** event
            `event: result` (`data`: run result) or `event: error` (plain-text
            data).
          content:
            text/event-stream: { schema: { type: string } }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/agents:
    get:
      tags: [agents]
      summary: List stored agents (ids only) for the caller's tenant
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated agent ids
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: string } } }
    post:
      tags: [agents]
      summary: Store an agent manifest
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties: { manifest: { type: string } }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, status: { type: string, enum: [created] } }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/xApexTenant'
      - $ref: '#/components/parameters/xApexPrincipal'
    get:
      tags: [agents]
      summary: Fetch a stored agent's manifest
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, manifest: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [agents]
      summary: Delete a stored agent
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/agents/{id}/run:
    post:
      tags: [agents]
      summary: Run a stored agent by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/xApexProject'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { input: {}, max_steps: { type: integer, nullable: true } }
      responses:
        '200':
          description: Run result
          content:
            application/json: { schema: { $ref: '#/components/schemas/RunResult' } }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  # ------------------------------------------------------------ workflows --
  /api/v1/workflows/validate:
    post:
      tags: [workflows]
      summary: Parse and validate a workflow DSL manifest (no side effects)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties: { manifest: { type: string } }
      responses:
        '200':
          description: Parsed definition summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  name: { type: string }
                  version: { type: string }
                  activities:
                    type: array
                    items:
                      type: object
                      properties: { id: { type: string }, type: { type: string }, name: { type: string } }
                  edges:
                    type: array
                    items:
                      type: object
                      properties: { from: { type: string }, to: { type: string }, when: { type: string, nullable: true } }
                  activity_count: { type: integer }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/workflows:
    get:
      tags: [workflows]
      summary: List workflow executions visible to the caller's tenant
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: workflow
          in: query
          schema: { type: string }
          description: Filter by workflow name.
        - name: status
          in: query
          schema:
            type: string
            enum: [created, validated, scheduled, running, waiting, resumed, compensating, completed, failed, cancelled]
      responses:
        '200':
          description: Paginated execution summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [workflows]
      summary: Submit (durably start + async-drive) a workflow execution
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: string }
                input: {}
                execution_id: { type: string, nullable: true, description: 'Auto-generated `<workflow-name>-<n>` if omitted.' }
      responses:
        '200':
          description: Submitted (does not wait for completion — poll `GET /api/v1/workflows/{id}`)
          content:
            application/json:
              schema:
                type: object
                properties: { execution_id: { type: string }, status: { type: string, enum: [submitted] } }

  /api/v1/workflows/{id}:
    get:
      tags: [workflows]
      summary: Get an execution's live status + event history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '200':
          description: Execution + events
          content:
            application/json:
              schema:
                type: object
                properties: { execution: { type: object }, events: { type: array, items: { type: object } } }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [workflows]
      summary: Cancel an execution (advisory — in-flight activities still complete)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '202': { description: Cancellation accepted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/workflows/{id}/signal:
    post:
      tags: [workflows]
      summary: Deliver an event to a `wait` activity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, event]
              properties: { manifest: { type: string }, event: { type: string }, payload: {} }
      responses:
        '200':
          description: Signalled
          content:
            application/json:
              schema:
                type: object
                properties: { execution_id: { type: string }, event: { type: string }, status: { type: string, enum: [signalled] } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/workflows/{id}/approve:
    post:
      tags: [workflows]
      summary: Resume a suspended human-approval activity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest, activity_id]
              properties:
                manifest: { type: string }
                activity_id: { type: string }
                decision: { description: 'Defaults to `{"approved": true}` if omitted.' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties: { execution_id: { type: string }, activity_id: { type: string }, status: { type: string, enum: [approved] } }
        '404': { $ref: '#/components/responses/Error' }

  # --------------------------------------------------------------- memory --
  /api/v1/memory/namespaces:
    get:
      tags: [memory]
      summary: List memory namespaces (with record counts) for the caller's tenant
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '200':
          description: Namespaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaces:
                    type: array
                    items:
                      type: object
                      properties: { namespace: { type: string }, count: { type: integer } }
                  total: { type: integer }

  /api/v1/memory/records:
    get:
      tags: [memory]
      summary: List memory records (newest first)
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: namespace
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [memory]
      summary: Store a memory record
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespace, content]
              properties:
                namespace: { type: string }
                content: { type: string }
                type: { type: string, enum: [semantic, conversation, workflow, episodic], default: semantic }
                importance: { type: number, minimum: 0, maximum: 1, default: 0.5 }
                tags: { type: array, items: { type: string }, default: [] }
                required_scopes:
                  type: array
                  items: { type: string }
                  default: []
                  description: 'Any client-supplied `tenant:` scope is stripped; the server appends its own.'
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, status: { type: string, enum: [stored] } }

  /api/v1/memory:query:
    post:
      tags: [memory]
      summary: Hybrid (vector + keyword) memory retrieval
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                namespace: { type: string, nullable: true }
                strategy: { type: string, enum: [vector, keyword, hybrid], default: hybrid }
                limit: { type: integer, nullable: true }
                diversity:
                  type: number
                  nullable: true
                  minimum: 0
                  maximum: 1
                  description: MMR diversification lambda.
                min_importance: { type: number, nullable: true }
                tags: { type: array, items: { type: string }, nullable: true }
                grants:
                  type: array
                  items: { type: string }
                  nullable: true
                  description: 'ABAC grants; client-supplied `tenant:` scopes are stripped.'
                relevance: { type: number, nullable: true }
                recency: { type: number, nullable: true }
                importance: { type: number, nullable: true }
      responses:
        '200':
          description: >-
            Query results — a ranked result set, not a page (no
            cursor/has_more; retrieval is bounded by limit/relevance, not an
            offset into a stable ordering).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        namespace: { type: string }
                        content: { type: string }
                        type: { type: string }
                        importance: { type: number }
                        tags: { type: array, items: { type: string } }
                        score: { type: number }
                        breakdown:
                          type: object
                          properties:
                            relevance: { type: number }
                            recency: { type: number }
                            importance: { type: number }
                            total: { type: number }
                  count: { type: integer }

  # -------------------------------------------------------------- plugins --
  /api/v1/plugins:
    get:
      tags: [plugins]
      summary: List installed plugins
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated installed plugins
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, description: 'publisher/name' }
                            name: { type: string }
                            version: { type: string }
                            publisher: { type: string }
                            description: { type: string }
                            state: { type: string, enum: [enabled, disabled] }
                            permissions: { type: array, items: { type: string } }
                            granted: { type: array, items: { type: string } }
                            capabilities:
                              type: array
                              items:
                                type: object
                                properties:
                                  kind: { type: string, enum: [tool, provider, memory_backend, policy, workflow_activity] }
                                  id: { type: string }
                            platform_api: { type: string }

  /api/v1/plugins:install:
    post:
      tags: [plugins]
      summary: Install a signed `.apexpkg` (verified + staged, registered disabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apexpkg]
              properties:
                apexpkg: { type: string, format: byte, description: base64-encoded .apexpkg }
                grants: { type: array, items: { type: string }, default: [] }
      responses:
        '200': { description: Installed (disabled) }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/plugins:enable:
    post:
      tags: [plugins]
      summary: Enable an installed plugin
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200': { description: Enabled }

  /api/v1/plugins:disable:
    post:
      tags: [plugins]
      summary: Disable an installed plugin
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200': { description: Disabled }

  /api/v1/plugins:upgrade:
    post:
      tags: [plugins]
      summary: Upgrade an installed plugin to a new signed package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apexpkg]
              properties:
                apexpkg: { type: string, format: byte }
                grants: { type: array, items: { type: string }, default: [] }
      responses:
        '200': { description: Upgraded }

  /api/v1/plugins:rollback:
    post:
      tags: [plugins]
      summary: Roll back a plugin to its previous version
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200': { description: Rolled back }

  /api/v1/plugins:trust:
    post:
      tags: [plugins]
      summary: Register a publisher's ed25519 public key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publisher, public_key_hex]
              properties:
                publisher: { type: string }
                public_key_hex: { type: string, description: 64 hex chars (32-byte ed25519 key). }
      responses:
        '200': { description: Trusted }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/plugins/{id}:
    delete:
      tags: [plugins]
      summary: Uninstall a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded `publisher/name`.
      responses:
        '200': { description: Uninstalled }

  # ----------------------------------------------------------- marketplace --
  /api/v1/marketplace/listings:
    get:
      tags: [marketplace]
      summary: Search/browse marketplace listings
      parameters:
        - name: q
          in: query
          schema: { type: string, default: '' }
        - name: category
          in: query
          schema: { type: string }
        - name: capability
          in: query
          schema: { type: string, enum: [tool, provider, memory_backend, policy, workflow_activity] }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated listings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }

  /api/v1/marketplace:publish:
    post:
      tags: [marketplace]
      summary: Publish a signed package to the registry
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apexpkg]
              properties:
                apexpkg: { type: string, format: byte }
                categories: { type: array, items: { type: string }, default: [] }
                channel: { type: string, default: stable }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing: { type: string }
                  reference: { type: string }
                  channel: { type: string }
                  status: { type: string, enum: [published] }
                  scan: { $ref: '#/components/schemas/ScanReport' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/marketplace/listings/{id}:
    get:
      tags: [marketplace]
      summary: Get one listing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: URL-encoded `publisher/name`.
      responses:
        '200': { description: Listing }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/marketplace/listings/{id}/download:
    get:
      tags: [marketplace]
      summary: Download a version's `.apexpkg` bytes (base64)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          schema: { type: string }
          description: Defaults to the latest stable-channel version.
      responses:
        '200':
          description: Package bytes
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, apexpkg: { type: string, format: byte } }

  /api/v1/marketplace/listings/{id}/attestation:
    get:
      tags: [marketplace]
      summary: Live supply-chain attestation for a version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Attestation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  version: { type: string }
                  publisher: { type: string }
                  verified: { type: boolean }
                  signature_verified: { type: boolean }
                  risk: { type: string, enum: [low, medium, high] }
                  permissions: { type: array, items: { type: string } }
                  package_digest: { type: string }
                  sbom: { type: array, items: { type: object }, nullable: true }
                  provenance: { type: object, nullable: true }
                  scan: { $ref: '#/components/schemas/ScanReport' }

  /api/v1/marketplace/listings/{id}/reviews:
    post:
      tags: [marketplace]
      summary: Add a 1-5 star review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author, rating]
              properties:
                author: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string, default: '' }
      responses:
        '200': { description: Reviewed }

  /api/v1/marketplace/listings/{id}/verify:
    post:
      tags: [marketplace]
      summary: Operator override — set the verified badge directly (bypasses the review workflow)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { verified: { type: boolean, default: true } }
      responses:
        '200': { description: Updated }

  /api/v1/marketplace/listings/{id}/request-review:
    post:
      tags: [marketplace]
      summary: Publisher requests human review of the current latest version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pending
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, status: { type: string, enum: [pending] } }

  /api/v1/marketplace/listings/{id}/approve:
    post:
      tags: [marketplace]
      summary: Reviewer approves the pending review (sets the verified badge)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reviewer: { type: string, nullable: true } }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, verified: { type: boolean }, reviewer: { type: string } }

  /api/v1/marketplace/listings/{id}/reject:
    post:
      tags: [marketplace]
      summary: Reviewer rejects the pending review with actionable feedback
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reviewer: { type: string, nullable: true }, reason: { type: string } }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string }, verified: { type: boolean }, reviewer: { type: string }, reason: { type: string } }

  /api/v1/marketplace/listings/{id}/install:
    post:
      tags: [marketplace]
      summary: Download a listed package and install it locally (disabled)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, nullable: true }
                grants: { type: array, items: { type: string }, default: [] }
      responses:
        '200': { description: Installed }

  # ---------------------------------------------------------------secrets --
  /api/v1/secrets:
    get:
      tags: [secrets]
      summary: List secret metadata (never values) for the caller's tenant
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated secret metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [secrets]
      summary: Create a secret
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value]
              properties: { name: { type: string }, value: { type: string } }
      responses:
        '200':
          description: Created (metadata only — value never returned)
          content:
            application/json: { schema: { type: object } }

  /api/v1/secrets/{name}:
    get:
      tags: [secrets]
      summary: Get one secret's metadata
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '200': { description: Metadata }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [secrets]
      summary: Delete a secret
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/secrets/{name}/rotate:
    post:
      tags: [secrets]
      summary: Rotate a secret's value (retains one previous version)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [value], properties: { value: { type: string } } }
      responses:
        '200': { description: Rotated (metadata only) }

  # -------------------------------------------------------------- tenancy --
  /api/v1/organizations:
    get:
      tags: [tenancy]
      summary: List organizations
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated organizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [tenancy]
      summary: Create an organization
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string } } }
      responses:
        '201': { description: Created }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/projects:
    get:
      tags: [tenancy]
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [tenancy]
      summary: Create a project
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, organization]
              properties: { name: { type: string }, organization: { type: string } }
      responses:
        '201':
          description: Created
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}:
    get:
      tags: [tenancy]
      summary: Get a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '200':
          description: Project
          headers:
            ETag: { schema: { type: string } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [tenancy]
      summary: Partially update a project (settings/status)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                settings: { type: object, nullable: true, additionalProperties: true }
                status: { type: string, nullable: true }
      responses:
        '200':
          description: Updated
          headers:
            ETag: { schema: { type: string } }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [tenancy]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '204': { description: Deleted }

  /api/v1/projects/{id}/members:
    get:
      tags: [tenancy]
      summary: List a project's members
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema: { type: object, properties: { members: { type: array, items: { type: object } } } }
    post:
      tags: [tenancy]
      summary: Add a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, role]
              properties:
                user: { type: string }
                role: { type: string, enum: [viewer, editor, project_admin, org_admin, platform_admin] }
      responses:
        '201': { description: Added }

  /api/v1/projects/{id}/members/{uid}:
    delete:
      tags: [tenancy]
      summary: Remove a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: uid
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '204': { description: Removed }

  /api/v1/projects/{id}/quota:
    get:
      tags: [tenancy]
      summary: Get a project's quota limits
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '200':
          description: Quota
          content:
            application/json:
              schema:
                type: object
                properties: { scope: { type: string, enum: [project] }, limits: { type: object } }
    patch:
      tags: [tenancy]
      summary: Update a project's quota limits (org.admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                concurrent_agent_runs: { type: integer, nullable: true }
                llm_cost_per_day_usd: { type: number, nullable: true }
      responses:
        '200':
          description: Updated quota
          content:
            application/json:
              schema:
                type: object
                properties: { scope: { type: string, enum: [project] }, limits: { type: object } }

  # -------------------------------------------------------------webhooks --
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      summary: List registered webhooks (secrets redacted)
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated webhooks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }
    post:
      tags: [webhooks]
      summary: Register a webhook subscription
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events, secret]
              properties:
                url: { type: string }
                events:
                  type: array
                  items: { type: string }
                  description: 'Wildcard topics supported (`*`, `plugin.*`) or an exact event type.'
                secret: { type: string }
      responses:
        '201': { description: Registered }

  /api/v1/webhooks/{id}:
    delete:
      tags: [webhooks]
      summary: Remove a webhook subscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
      responses:
        '204': { description: Removed }

  # ---------------------------------------------------------------- audit --
  /api/v1/audit:
    get:
      tags: [audit]
      summary: Query the tamper-evident audit log (tenant-scoped), most-recent first
      parameters:
        - $ref: '#/components/parameters/xApexTenant'
        - $ref: '#/components/parameters/xApexPrincipal'
        - name: principal
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties: { data: { type: array, items: { type: object } } }

  # ---------------------------------------------------------------- tools --
  /api/v1/tools:
    get:
      tags: [tools]
      summary: List available tools (built-ins + enabled plugin tools)
      security: []
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Paginated tools
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            description: { type: string }
                            category: { type: string }
                            permissions: { type: array, items: { type: string }, nullable: true }

security:
  - tenantHeader: []
    principalHeader: []
