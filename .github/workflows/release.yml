# Release pipeline for the Wovyr AI Platform (RM-AIM-P1 DX-102).
#
# Before this existed, "releasing" meant a git tag and nothing else: no binaries, no
# published container image (CI built `wovyr:ci` and threw it away), no SDK artifacts,
# no release notes. This workflow makes a tag push produce all of them:
#
#   - cross-platform `wovyr` binaries (Linux x86_64, Windows x86_64, macOS arm64)
#     with sha256 checksums,
#   - a container image pushed to GHCR (`ghcr.io/<owner>/wovyr`) tagged with both the
#     version and `latest` — the repo the Helm chart now defaults to,
#   - packed SDK artifacts: an npm tarball for `@wovyr/sdk` and a wheel+sdist for
#     `wovyr-sdk`, attached to the release so a consumer can install a pinned
#     artifact even before/without a registry publish,
#   - every publishable workspace crate pushed to crates.io — the registry behind
#     the README's own first quickstart command, `cargo install wovyr-cli`,
#   - a GitHub Release whose body is this version's section of CHANGELOG.md.
#
# Registry publishes are deliberately *gated, optional* steps: `npm publish`
# requires a granular NPM_TOKEN secret (the org enforces 2FA — see
# sdks/typescript/README.md's publish note), PyPI requires PYPI_API_TOKEN, and
# crates.io requires CARGO_REGISTRY_TOKEN; when a secret is absent the
# corresponding publish step is skipped rather than failing the whole release,
# because the packed artifacts above are still produced and attached either way.
#
# `workflow_dispatch` is the dry-run path (acceptance criterion): it runs every
# build/pack job identically but pushes nothing — no image push, no registry
# publish, no GitHub Release — so the pipeline can be exercised end to end without
# minting a release.
#
# One-time operator prerequisite for the GHCR push (not fixable from this file):
# a container package that was first created by a local `docker push` belongs to
# the *user*, connected to no repository, and therefore grants no write access to
# this repository's `GITHUB_TOKEN` — `permissions: packages: write` below is
# necessary but not sufficient, and the push fails with
# `denied: permission_denied: write_package` (this is exactly how v0.3.2 failed).
# Fix it once, either way:
#   - github.com/users/<owner>/packages/container/wovyr/settings →
#     "Manage Actions access" → add this repository with the **Write** role; or
#   - delete the package and let this workflow create it, which auto-links it via
#     the `org.opencontainers.image.source` label stamped below.
# Every image this workflow (or the Dockerfile) builds now carries that label, so
# a freshly-created package links itself and no future release needs this step.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # A tag push is a real release; a manual dispatch is a dry run.
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write # create the GitHub Release
  packages: write # push the image to GHCR

jobs:
  binaries:
    name: binaries (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p wovyr-cli --target ${{ matrix.target }}

      - name: Package (tar.gz + sha256)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/wovyr
          OUT=wovyr-${{ matrix.name }}.tar.gz
          tar -czf "$OUT" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          shasum -a 256 "$OUT" > "$OUT.sha256"

      - name: Package (zip + sha256)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/wovyr.exe"
          $out = "wovyr-${{ matrix.name }}.zip"
          Compress-Archive -Path $bin -DestinationPath $out
          (Get-FileHash $out -Algorithm SHA256).Hash.ToLower() + "  $out" | Out-File -Encoding ascii "$out.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wovyr-${{ matrix.name }}
          path: |
            wovyr-${{ matrix.name }}.*
          if-no-files-found: error

  image:
    name: container image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name + version
        id: meta
        shell: bash
        run: |
          # GHCR requires a lowercase repository path.
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/wovyr" >> "$GITHUB_OUTPUT"
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dry-run" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on a real release)
        uses: docker/build-push-action@v6
        env:
          # Don't upload the buildx build record as a GitHub artifact. It's
          # uploaded uncompressed while being declared gzip, so any
          # actions/download-artifact call that sees it fails to extract it
          # (docker/build-push-action#1334, closed as kind/upstream) — which is
          # exactly what broke the `release` job's "Download all artifacts"
          # step for v0.3.2. Nothing in this pipeline consumes the record.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: deployment/docker/Dockerfile
          # Same feature set docker-compose/Helm run with, so the published image
          # supports the tiered Postgres/Qdrant backends out of the box.
          build-args: |
            FEATURES=tiered-memory,postgres
          push: ${{ env.IS_RELEASE == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # `org.opencontainers.image.source` is what tells GHCR which repository
          # owns this package; an unlinked package doesn't inherit the repo's
          # Actions permissions, so `permissions: packages: write` above isn't
          # enough on its own (see the LABEL block in the Dockerfile). Stamped
          # here as well as in the Dockerfile so it always names *this* repo
          # rather than a hardcoded one, and to carry the per-build revision.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  sdks:
    name: pack SDKs (npm + PyPI artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Pack @wovyr/sdk
        working-directory: sdks/typescript
        run: |
          npm ci
          npm run build
          npm pack --pack-destination ..
        # Produces sdks/wovyr-sdk-<version>.tgz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wovyr-sdk (wheel + sdist)
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build
          python -m build --outdir ../dist-python

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-packages
          path: |
            sdks/*.tgz
            sdks/dist-python/*
          if-no-files-found: error

      # Registry publishes: optional, gated on secrets being configured. Skipping
      # them never fails the release — the packed artifacts above ship regardless.
      #
      # The token check lives *inside* each script, deliberately. These two steps
      # used to read `if: env.IS_RELEASE == 'true' && env.NODE_AUTH_TOKEN != ''`
      # with the secret bound in the same step's `env:` — which can never be true.
      # Per GitHub's own docs, "Secrets cannot be directly referenced in `if:`
      # conditionals"; a step's own `env:` is not populated at the time its `if:`
      # is evaluated. The result was a silent no-op: both steps reported `skipped`
      # on every release run that has ever existed (v0.3.1, v0.3.2, v0.4.0), the
      # job and the whole workflow still went green, and every version live on npm
      # and PyPI was in fact published by hand. GitHub suggests hoisting the secret
      # to job-level `env`, but that exposes it to every step in the job; checking
      # in-script keeps it step-scoped and, unlike a false `if:`, leaves a log line
      # saying why it skipped. Don't move these conditions back into `if:`.
      - name: Publish to npm (if NPM_TOKEN configured)
        if: env.IS_RELEASE == 'true'
        shell: bash
        working-directory: sdks/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is not configured — skipping the npm publish."
            exit 0
          fi
          # npm has no --skip-existing; re-publishing a version is a hard 403.
          # Check first so re-running a release is safe.
          version="$(node -p 'require("./package.json").version')"
          if npm view "@wovyr/sdk@${version}" version >/dev/null 2>&1; then
            echo "@wovyr/sdk@${version} is already on npm — nothing to publish."
            exit 0
          fi
          npm publish --access public

      - name: Publish to PyPI (if PYPI_API_TOKEN configured)
        if: env.IS_RELEASE == 'true'
        shell: bash
        working-directory: sdks/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${TWINE_PASSWORD:-}" ]]; then
            echo "PYPI_API_TOKEN is not configured — skipping the PyPI publish."
            exit 0
          fi
          python -m pip install --upgrade twine
          # --skip-existing makes a re-run idempotent rather than a 400.
          python -m twine upload --skip-existing ../dist-python/*

  crates:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # 22 crates, each verified by a real build before upload.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A re-run has to be safe. A partial publish is the likely failure mode at
      # this size — one network hiccup two thirds of the way through leaves the
      # release half-shipped, and a naive re-run would die immediately on "crate
      # version already exists" for the very first crate, forcing a hand-driven
      # recovery across whatever remains. Excluding what the index already
      # carries makes recovery just "re-run the job".
      #
      # The sparse index (not the crates.io API) is the check: no rate limit, no
      # User-Agent requirement, and it's the same source cargo itself resolves
      # against. Versions come from `cargo metadata` per package rather than from
      # the tag, so this stays correct even if a crate ever leaves the DX-101
      # workspace-version lockstep.
      - name: Determine which crates still need publishing
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          # Resolve the member list up front and assert it's non-empty. If this
          # silently produced nothing, `pending` would be 0, the publish step's
          # own `if` would skip it, and the release would report success having
          # shipped nothing at all — the one failure mode here that wouldn't be
          # obvious from a green run.
          mapfile -t members < <(
            cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"'
          )
          if [[ ${#members[@]} -eq 0 ]]; then
            echo "::error::cargo metadata returned no publishable packages"
            exit 1
          fi

          excludes=()
          pending=0
          for entry in "${members[@]}"; do
            read -r name version <<<"$entry"
            # Sparse-index paths bucket by name length; every crate here is >=4
            # chars, so only the two-level form is implemented. Fail loudly
            # rather than silently mis-checking if that ever stops being true.
            if [[ ${#name} -lt 4 ]]; then
              echo "::error::sparse-index path for short crate name '$name' is not handled"
              exit 1
            fi
            index="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
            # The index serves newline-delimited JSON, one object per version.
            # A 404 (never published) or a transient failure both fall to the
            # else branch: worst case we re-attempt a publish that then fails
            # loudly on "already exists", rather than skipping one silently.
            if curl -sfL "$index" | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null 2>&1; then
              echo "already published: ${name} ${version}"
              excludes+=(--exclude "$name")
            else
              echo "to publish:        ${name} ${version}"
              pending=$((pending + 1))
            fi
          done

          echo "pending=${pending}" >> "$GITHUB_OUTPUT"
          echo "excludes=${excludes[*]:-}" >> "$GITHUB_OUTPUT"
          echo "${pending} of ${#members[@]} crate(s) pending publish."

      # The dry-run path for `workflow_dispatch`: packages and verifies every
      # member exactly as a real publish would, but uploads nothing.
      - name: Publish (dry run)
        if: env.IS_RELEASE != 'true'
        run: cargo publish --workspace --dry-run

      # `--workspace` (Cargo 1.90+) derives the publish order from the dependency
      # graph and verifies each member against the other *local* members, so all
      # 22 go up in the right order with no hand-maintained list to drift out of
      # date. `publish = false` members (wovyr-eval) are skipped automatically.
      #
      # The token check lives in the script rather than in `if:` so the skip
      # leaves an explanatory line in the log instead of a silently grey step.
      - name: Publish to crates.io (if CARGO_REGISTRY_TOKEN configured)
        if: env.IS_RELEASE == 'true' && steps.plan.outputs.pending != '0'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Via env rather than interpolated straight into the script: the value
          # is repo-derived and trusted, but `${{ }}` into a shell body is the
          # injection shape, and there's no reason to write it here.
          EXCLUDES: ${{ steps.plan.outputs.excludes }}
        run: |
          set -euo pipefail
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "CARGO_REGISTRY_TOKEN is not configured — skipping the crates.io publish."
            echo "The packed artifacts and the GitHub Release still ship."
            exit 0
          fi
          # Unquoted on purpose — the list must word-split into separate flags.
          cargo publish --workspace ${EXCLUDES}

  release:
    name: GitHub release
    # A dry run stops after building everything; only a real tag mints a release.
    if: startsWith(github.ref, 'refs/tags/v')
    # Deliberately *not* gated on `crates`: a crates.io outage shouldn't withhold
    # the binaries and release notes, which are independently useful. A failed
    # publish still turns the run red, so it can't pass unnoticed.
    needs: [binaries, image, sdks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Download only the artifacts this workflow's own jobs uploaded, by name.
      # A bare "download everything" also picks up artifacts uploaded as a side
      # effect by third-party actions (see DOCKER_BUILD_RECORD_UPLOAD above),
      # which both breaks this step and would attach stray files to the release
      # via the `files: artifacts/**` glob below.
      - name: Download binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: wovyr-*
          path: artifacts
          merge-multiple: true

      - name: Download SDK packages
        uses: actions/download-artifact@v4
        with:
          name: sdk-packages
          path: artifacts

      - name: Extract this version's CHANGELOG section
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the block between "## [<version>]" and the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG section found for ${VERSION}; using a stub." >&2
            echo "See CHANGELOG.md." > release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/**
          fail_on_unmatched_files: true
