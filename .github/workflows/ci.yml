# CI pipeline for the Apex AI Platform.
# Mirrors docs/19-implementation-guide/build-system.md §8:
#   fmt+clippy → build → unit → integration
# Automated security scanning (docs/15-testing/security-testing.md §8) gates the
# same pipeline: SAST is the `rust` job's clippy step (`-D warnings`); `security`
# below adds the rest — dependency CVEs (SCA) and secret scanning — and
# `container-scan` builds the single-binary Docker image and scans it for
# vulnerabilities (also the image's first real CI build).
# The `rust` job's later steps are named regression gates, run and reported
# explicitly even though they already execute as part of `cargo test --workspace`
# above — so a failure reads as a specific, legible finding rather than being buried
# in the full test count:
#   - RM-GA-P1 SEC-105's negative-authorization matrix (`crates/apex-server/tests/
#     authz_matrix.rs`): every mutating/secret/KMS/plugin/marketplace/audit route
#     must reject a missing or under-scoped credential. A route added without a
#     matching table entry fails its own hand-maintained coverage tripwire.
#   - FUT-006's eval regression gate (docs/18-roadmap/future/B6-trust-evaluation.md
#     §8.3): apex-eval's deterministic fixture-based suites, run with --nocapture so
#     pass rates are visible in the log.
# RM-GA-P2 CI-901 adds the feature matrix (`feature-matrix` below): the `rust` job
# only ever compiles default features, so feature-gated code was never linted and
# every capability-gated integration test skipped silently forever. `feature-matrix`
# clippy-checks each feature in isolation via cargo-hack, and
# `services-integration` runs the Postgres/Qdrant/Redis-gated tests against real
# service containers — failing if any of them *skips* instead of running.
# RM-GA-P4 API-704 adds `contract-gate`: `openapi.yaml` was hand-synced with no CI
# enforcement, and the TypeScript/Python SDK integration suites (which exercise a
# real server, not mocks) only ever ran manually — nothing stopped a handler's
# response shape from silently diverging from the contract the already-published
# PyPI SDK was written against. Both suites skip cleanly (not fail) when no server
# answers, so the job boots a real `apex dev` and waits for `/healthz` before
# running them, rather than relying on that offline fallback ever exercising them.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: build + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # ECO-302: the plugin-scaffold round-trip test compiles a generated
          # project to wasm32-wasip1; without the target it skips silently.
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # RM-GA-P1 SEC-105 negative-authorization gate: fails if any protected route
      # accepts a missing/unknown credential (401 expected) or an authenticated-but-
      # under-scoped principal (403 expected), or if the route table's hand-maintained
      # coverage count has drifted from the server's actual route registrations.
      - name: Negative-authorization gate (SEC-105)
        run: cargo test -p apex-server --test authz_matrix -- --nocapture

      # FUT-006 eval regression gate: apex-eval's deterministic fixture-based
      # suites, named explicitly (not folded silently into the step above) so
      # a failure here reads as "quality regression detected," and run with
      # --nocapture so each suite's EvalReport/ComparisonReport (pass rates,
      # per-case detail) is visible in the log. Scripted deterministic
      # providers only — the real `mistralrs` path (crates/apex-eval/tests/
      # real_model_comparison.rs) stays off in CI, same as every other
      # optional/expensive feature-gated test in this workspace (Redis,
      # Qdrant, Postgres): it needs network access to download model weights
      # and real CPU inference time neither is guaranteed here.
      # RM-AIM-P2 EVL-202 makes the gate *quantified*: regression_gate runs the
      # committed suite (crates/apex-eval/suites/) against the committed golden
      # baseline (crates/apex-eval/baselines/), fails on a dropped pass rate or
      # any per-case regression, reports variance over N repeated runs, and
      # writes report/variance/gate JSON into APEX_EVAL_ARTIFACT_DIR — uploaded
      # below so every CI run's eval scores persist as an inspectable artifact.
      # To refresh the baseline after an intentional change:
      # APEX_EVAL_UPDATE_BASELINE=1 cargo test -p apex-eval --test regression_gate
      - name: Eval regression gate (FUT-006 / EVL-202)
        env:
          APEX_EVAL_ARTIFACT_DIR: ${{ github.workspace }}/eval-artifacts
        run: |
          cargo test -p apex-eval --test regression_gate -- --nocapture
          cargo test -p apex-eval --test regression_detection -- --nocapture
          cargo test -p apex-eval --test multi_agent_vs_single_agent -- --nocapture
          cargo test -p apex-eval --test llm_judge_scoring -- --nocapture
          cargo test -p apex-eval --test rag_eval -- --nocapture
      - name: Upload eval artifacts (EVL-202)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-artifacts/
          if-no-files-found: warn

  # RM-AIM-P1 DX-103 (Windows leg): every runner above is ubuntu-latest, but the
  # platform is developed on (and ships for) Windows too — and Windows-specific
  # breakage has happened in practice (cmd.exe vs sh, temp-dir semantics, and the
  # SBX-102 Job Object sandbox path, which is `#[cfg(windows)]`-only and therefore
  # *never compiled* by a Linux-only pipeline). Build + test the whole workspace on
  # windows-latest so that code is exercised on every PR, not just on a
  # contributor's machine.
  rust-windows:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  # RM-AIM-P1 DX-103 (dashboard leg): the Angular SPA had zero CI references — a
  # broken dashboard build/test shipped silently. Builds the production bundle and
  # runs the Jasmine/Karma suite (UI-102's specs: the SSE stream parser, the agent
  # manifest round-trip, the workflow serializer, and UI-101's
  # credential-not-in-localStorage assertions) in headless Chrome.
  dashboard:
    name: dashboard build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npx ng build

      - name: Test (headless)
        run: npx ng test --watch=false --browsers=ChromeHeadless

  # RM-GA-P2 CI-901 (first half): compile + lint every feature-gated code path.
  # `cargo hack clippy --each-feature` runs clippy once per crate per feature (plus
  # the no-feature baseline), so a warning inside a `#[cfg(feature = ...)]` module
  # breaks CI exactly like one in default-feature code — closing the gap where ~20
  # feature flags across 11 crates were never linted despite the -D warnings policy.
  # `mistralrs` is the one exclusion: it pulls the full mistral.rs inference engine,
  # a multi-tens-of-minutes compile that would dominate the whole pipeline — the
  # same cost/benefit call that keeps its runtime tests out of CI (see the eval-gate
  # comment above). It remains compilable locally via
  #   cargo clippy -p apex-provider --features mistralrs
  feature-matrix:
    name: feature matrix (clippy each feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy each feature (deny warnings)
        run: >
          cargo hack clippy --workspace --each-feature
          --exclude-features mistralrs --all-targets -- -D warnings

  # RM-GA-P2 CI-901 (second half): actually run the capability-gated integration
  # tests that skip silently when their backend is absent. Postgres, Qdrant, and
  # Redis run as service containers; the env vars below are exactly what each test
  # gates on. Every test file logs `skipping: ...` when it can't reach its backend,
  # so the wrapper greps the output and fails on a skip — a test that silently
  # skipped would otherwise read as green coverage.
  services-integration:
    name: service-container integration (Postgres/Qdrant/Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        # No --health-cmd: the qdrant image ships no curl/wget/nc to probe itself
        # with; readiness is checked from the runner in the wait step below.
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]
    env:
      APEX_WORKFLOW_POSTGRES_URL: postgres://apex:apex@localhost:5432/apex
      APEX_MARKETPLACE_POSTGRES_URL: postgres://apex:apex@localhost:5432/apex
      APEX_MEMORY_POSTGRES_URL: postgres://apex:apex@localhost:5432/apex
      APEX_MEMORY_QDRANT_URL: http://localhost:6333
      APEX_QDRANT_URL: http://localhost:6333
      APEX_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "qdrant never became ready" >&2
          exit 1

      # RM-GA-P3 MIG-A1: PostgresStore::connect only ever *reads* the schema
      # version now, it never runs DDL — so the three Postgres-backed schemas
      # must be migrated explicitly before the capability-gated tests below can
      # connect at all (an unmigrated schema is a fail-closed connect error,
      # which the tests below correctly treat as an unrecoverable "skipping:").
      - name: Migrate Postgres schemas (workflow, memory, marketplace)
        run: |
          set -euo pipefail
          cargo run -p apex-cli --features postgres,tiered-memory -- admin migrate \
            --target workflow --database-url "$APEX_WORKFLOW_POSTGRES_URL"
          cargo run -p apex-cli --features postgres,tiered-memory -- admin migrate \
            --target memory --database-url "$APEX_MEMORY_POSTGRES_URL"
          cargo run -p apex-cli --features postgres,tiered-memory -- admin migrate \
            --target marketplace --database-url "$APEX_MARKETPLACE_POSTGRES_URL"

      # RM-GA-P4 HLTH-902: the CLI's marketplace commands (publish/search/get/report)
      # call the sync `postgres` crate's `Client::connect` directly from this
      # `#[tokio::main]` binary's async `run()` — which panics ("Cannot start a
      # runtime from within a runtime") unless wrapped in `spawn_blocking`, the exact
      # bug `apex-server`'s `with_registry` already fixed on the server side. Nothing
      # above exercises the CLI binary itself against Postgres (only the underlying
      # crates' own tests), so this bug shipped undetected even after CI-901 landed.
      # A plain `plugin search` against the just-migrated marketplace schema is
      # enough to prove it: it reaches `PostgresRegistryStore::connect` on every
      # invocation regardless of whether the registry has any listings yet.
      - name: CLI marketplace command against Postgres — no panic (HLTH-902)
        run: |
          set -euo pipefail
          out=$(cargo run -p apex-cli --features postgres -- plugin search 2>&1)
          echo "$out"
          if echo "$out" | grep -qi "panicked"; then
            echo "::error::apex plugin search panicked against a Postgres-backed registry" >&2
            exit 1
          fi

      # Each invocation is wrapped so a `skipping:` line (the tests' capability-gate
      # convention) fails the job: in this job the backends are guaranteed present,
      # so a skip means the wiring regressed, not that the environment is offline.
      - name: Run capability-gated integration tests
        run: |
          set -euo pipefail
          run_gated() {
            local out
            out=$(mktemp)
            "$@" -- --nocapture 2>&1 | tee "$out"
            if grep -q "skipping:" "$out"; then
              echo "::error::a capability-gated test skipped despite services being up" >&2
              exit 1
            fi
          }
          run_gated cargo test -p apex-workflow --features postgres --test postgres_store
          run_gated cargo test -p apex-marketplace --features postgres --test postgres_store
          run_gated cargo test -p apex-memory --features tiered --test tiered_backend
          run_gated cargo test -p apex-provider --features qdrant --test semantic_cache_qdrant
          run_gated cargo test -p apex-provider --features redis --test redis_breaker
          # SRV-201: shared rate limiting — inline (RateLimiter is pub(crate)), so
          # filter the lib suite to the rate_limit module rather than a tests/ file.
          run_gated cargo test -p apex-server --features redis --lib rate_limit

  # RM-GA-P4 API-704: the API contract gate (PRD-003 R-7.4). Boots a real `apex
  # dev` server from this PR's code, then runs `redocly lint` and both SDKs'
  # integration suites against it — a required gate, not an informational one:
  # `APEX_ALLOW_ANONYMOUS=1` (loopback-only, so this is safe) and
  # `APEX_PLATFORM_ADMINS=sdk-test-admin` are exactly what both suites'
  # docstrings say they need to exercise every route, including the org/project
  # ones that have no anonymous-default-tenant bypass — without them the suites
  # would silently skip instead of actually gating anything.
  contract-gate:
    name: API contract gate (redocly lint + TS/Python SDK suites)
    runs-on: ubuntu-latest
    env:
      APEX_ALLOW_ANONYMOUS: "1"
      APEX_PLATFORM_ADMINS: sdk-test-admin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Backgrounded: this step returns immediately, the server keeps running
      # for the rest of the job (same runner VM, not a separate container) until
      # the cleanup step below kills it. `$!` must be captured in this same
      # `run:` block — it only refers to the immediately-preceding background job.
      - name: Start apex dev server
        run: |
          cargo run -p apex-cli -- dev > apex-dev.log 2>&1 &
          echo $! > apex-dev.pid

      # A cold cache compiles apex-cli's full dependency tree on first boot, same
      # as services-integration's migration step below it — a generous window
      # avoids flaking on that, not on the server itself being slow to start.
      - name: Wait for the server to be ready
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/healthz > /dev/null 2>&1 && exit 0
            sleep 3
          done
          echo "::error::apex dev server never became ready" >&2
          cat apex-dev.log
          exit 1

      # `npm test` = lint:openapi (redocly) + build + the integration suite
      # (dist/test/client.test.js) — one command covers both halves of this
      # ticket's TypeScript side.
      - name: TypeScript SDK — redocly lint + integration suite
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test

      # Stdlib-only (no requests/httpx) — no install step needed beyond the
      # interpreter itself.
      - name: Python SDK — integration suite
        working-directory: sdks/python
        run: python3 -m unittest discover -s tests -v

      - name: Server log
        if: always()
        run: cat apex-dev.log || true

      - name: Stop apex dev server
        if: always()
        run: kill "$(cat apex-dev.pid)" 2>/dev/null || true

  security:
    name: dependency + secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # audit-check posts its findings as a check run, which needs write access
      # even when the repo's default GITHUB_TOKEN permissions are read-only.
      checks: write
    steps:
      - uses: actions/checkout@v4

      # SCA: RustSec advisory-DB check against Cargo.lock. Annotates the PR/commit
      # via the default GITHUB_TOKEN; no extra secrets needed.
      - name: Dependency audit (cargo-audit / RustSec)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # License policy + duplicate-version bans (RM-GA-P4 HLTH-904), via the
      # upstream action's prebuilt binary (no cargo-deny compile in CI). Config
      # in `deny.toml`; RustSec advisories are already covered by the step above,
      # so this only runs the `bans`/`licenses`/`sources` checks.
      - name: License / duplicate-version policy (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      # Secret scanning: the standalone gitleaks binary (not the wrapper Action,
      # which gates organizational use behind a license) against the checked-out
      # working tree only — `--no-git` scans files as they are at this commit
      # rather than replaying the full history on every run.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-git --redact --exit-code 1

  container-scan:
    name: container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the apex image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          tags: apex:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container scanning: fail the build on known HIGH/CRITICAL vulnerabilities
      # in the OS packages and Rust dependencies baked into the image.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: apex:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
