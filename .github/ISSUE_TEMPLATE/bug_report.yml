name: Bug report
description: Something doesn't work the way the docs or code say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security vulnerabilities must not be filed here** —
        use [private vulnerability reporting](../../security/advisories/new) instead
        (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Ran `wovyr ...`
        2. Expected ...
        3. Got ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest command sequence / manifest / request that shows the problem.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.3.0, or a commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Linux x86_64 / macOS arm64 / Windows 11; Rust 1.93
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Run with `WOVYR_LOG=debug` if possible. Redact anything sensitive.
      render: text
