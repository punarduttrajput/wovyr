[package]
name = "apex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The `apex` command-line interface for the Apex AI Platform."

[[bin]]
name = "apex"
path = "src/main.rs"

[features]
# Durable tiered memory backend (Postgres + Qdrant), selected at runtime via
# APEX_MEMORY_POSTGRES_URL + APEX_MEMORY_QDRANT_URL. Off by default (heavy deps).
tiered-memory = ["apex-memory/tiered"]
# OpenTelemetry OTLP trace export (spans → OTEL_EXPORTER_OTLP_ENDPOINT).
otlp = ["apex-telemetry/otlp"]
# The WASM plugin capability loader, so enabled plugin tools actually execute on
# `agents run --local`. Off by default (pulls Wasmtime via apex-plugin/wasi). Pulls
# the secret vault so a tenant-scoped run injects the plugin's secrets into the sandbox.
plugin-wasi = ["apex-plugin/wasi"]
# Rekor client for `plugin keyless-sign --rekor <url>` (witness signings in a
# transparency log, ADR-0009). Off by default (pulls reqwest's blocking client).
keyless-rekor = ["apex-plugin/rekor"]
# Postgres-backed marketplace registry: when APEX_MARKETPLACE_POSTGRES_URL is set,
# both `apex plugin publish|search|get` and the embedded `apex dev` server share the
# same durable catalog instead of each process reading its own `registry.json`. Off by
# default (pulls the `postgres` crate).
postgres = ["apex-marketplace/postgres", "apex-server/postgres", "apex-workflow/postgres"]
# Real local-model inference via mistral.rs: `agents run --local --provider mistralrs`
# for a one-off CLI run, or `APEX_PROVIDER=mistralrs apex dev` to make the embedded
# server (and hence the dashboard) run every agent against it. Off by default (pulls
# the heavy mistral.rs inference engine and downloads real GGUF weights on first use).
# See apex-provider's mistralrs_provider module for the model/env-var configuration
# this forwards to.
mistralrs = ["apex-provider/mistralrs", "apex-server/mistralrs"]
# Redis-shared rate limiting for the embedded `apex dev` server (RM-AIM-P2 SRV-201):
# with APEX_RATE_LIMIT_REDIS_URL set, a fleet of nodes enforces one combined per-key
# budget instead of N independent ones. Off by default (pulls the redis client).
redis = ["apex-server/redis"]

[dependencies]
apex-common.workspace = true
apex-provider.workspace = true
apex-tools.workspace = true
apex-agent.workspace = true
apex-workflow.workspace = true
apex-runtime.workspace = true
apex-kms.workspace = true
apex-config.workspace = true
apex-memory.workspace = true
apex-telemetry.workspace = true
apex-plugin.workspace = true
apex-marketplace.workspace = true
apex-server.workspace = true
# Secret vault — used (under `plugin-wasi`) to inject a run's tenant-scoped secrets into
# plugin tool sandboxes. Unconditional (RM-GA-P4 HLTH-903): `apex-config`'s shared
# secrets-vault construction depends on it unconditionally too, and apex-secrets is a
# small crate already pulled in transitively via apex-kms's dependents.
apex-secrets.workspace = true
# `rt-multi-thread` + `macros` for the binary's own `#[tokio::main]` (also covers
# `plugin.rs`'s `spawn_blocking` and `workflow.rs`'s local `#[tokio::test]`s — RM-GA-P4
# HLTH-904).
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde.workspace = true
serde_json.workspace = true
# Rendering the digest-complete `plugin.yaml` that `apex plugin build` stages
# (RM-AIM-P3 ECO-302) — same version the manifest parser itself uses.
serde_yaml.workspace = true
clap.workspace = true
reqwest.workspace = true
async-trait.workspace = true
# ed25519 keygen + signing for `apex plugin keygen|sign` (CLI tooling: signing lives
# outside the determinism-constrained library core).
ring.workspace = true
# The running platform-API version the engine checks plugin compatibility against.
semver.workspace = true
# Backup-manifest content digests for `apex admin backup|restore` (RM-GA-P2 DR-1001) —
# same versions already used by apex-plugin/apex-kms elsewhere in the workspace.
sha2.workspace = true
hex = "0.4"
# AWS SigV4 request signing for an s3:// `apex admin backup|restore` destination
# (GA-002 §4.1) — same crate/version apex-events already uses for webhook signing.
hmac.workspace = true
