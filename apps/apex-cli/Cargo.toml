[package]
name = "apex-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The `apex` command-line interface for the Apex AI Platform."

[[bin]]
name = "apex"
path = "src/main.rs"

[features]
# Durable tiered memory backend (Postgres + Qdrant), selected at runtime via
# APEX_MEMORY_POSTGRES_URL + APEX_MEMORY_QDRANT_URL. Off by default (heavy deps).
tiered-memory = ["apex-memory/tiered"]
# OpenTelemetry OTLP trace export (spans → OTEL_EXPORTER_OTLP_ENDPOINT).
otlp = ["apex-telemetry/otlp"]
# The WASM plugin capability loader, so enabled plugin tools actually execute on
# `agents run --local`. Off by default (pulls Wasmtime via apex-plugin/wasi). Pulls
# the secret vault so a tenant-scoped run injects the plugin's secrets into the sandbox.
plugin-wasi = ["apex-plugin/wasi", "dep:apex-secrets"]
# Rekor client for `plugin keyless-sign --rekor <url>` (witness signings in a
# transparency log, ADR-0009). Off by default (pulls reqwest's blocking client).
keyless-rekor = ["apex-plugin/rekor"]
# Postgres-backed marketplace registry: when APEX_MARKETPLACE_POSTGRES_URL is set,
# both `apex plugin publish|search|get` and the embedded `apex dev` server share the
# same durable catalog instead of each process reading its own `registry.json`. Off by
# default (pulls the `postgres` crate).
postgres = ["apex-marketplace/postgres", "apex-server/postgres"]

[dependencies]
apex-common.workspace = true
apex-provider.workspace = true
apex-tools.workspace = true
apex-agent.workspace = true
apex-workflow.workspace = true
apex-memory.workspace = true
apex-telemetry.workspace = true
apex-plugin.workspace = true
apex-marketplace.workspace = true
apex-server.workspace = true
# Secret vault — used (under `plugin-wasi`) to inject a run's tenant-scoped secrets into
# plugin tool sandboxes; optional so the default CLI build stays lean.
apex-secrets = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
reqwest.workspace = true
async-trait.workspace = true
# ed25519 keygen + signing for `apex plugin keygen|sign` (CLI tooling: signing lives
# outside the determinism-constrained library core).
ring = "0.17"
# The running platform-API version the engine checks plugin compatibility against.
semver = "1"
