    <circle cx="18" cy="6" r="2.5" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="18" r="2.5" stroke="currentColor" stroke-width="2"/>
    <path d="M8.2 7.3L11 16M15.8 7.3L13 16M8.5 6h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-marketplace" viewBox="0 0 24 24" fill="none">
