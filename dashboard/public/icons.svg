  </symbol>
  <symbol id="i-workflows" viewBox="0 0 24 24" fill="none">
    <rect x="3" y="4" width="6" height="5" rx="1.4" stroke="currentColor" stroke-width="2"/>
    <rect x="15" y="15" width="6" height="5" rx="1.4" stroke="currentColor" stroke-width="2"/>
    <path d="M9 6h4a2 2 0 012 2v9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-agents" viewBox="0 0 24 24" fill="none">
