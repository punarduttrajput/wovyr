    <path d="M5 6v6c0 1.66 3.13 3 7 3s7-1.34 7-3V6M5 12v6c0 1.66 3.13 3 7 3s7-1.34 7-3v-6" stroke="currentColor" stroke-width="2"/>
  </symbol>
  <symbol id="i-surfaces" viewBox="0 0 24 24" fill="none">
