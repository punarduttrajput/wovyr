<svg xmlns="http://www.w3.org/2000/svg">
  <!-- UI-306: the shared icon sprite. Nav/topbar icons used to live as inline
       SVG strings in component code (nudging the per-component style budget and
       re-parsing per render); referenced via <use href="icons.svg#<id>">. All
       symbols draw with stroke="currentColor" so CSS color applies. -->
  <symbol id="i-monitoring" viewBox="0 0 24 24" fill="none">
    <path d="M3 12h4l3 8 4-16 3 8h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-audit" viewBox="0 0 24 24" fill="none">
    <path d="M12 3l7 3v5c0 4.6-3 8.6-7 10-4-1.4-7-5.4-7-10V6l7-3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
