<!-- DSY-103: Wovyr wordmark for Starlight's SiteTitle when the DOCS SITE renders
     in dark mode (Starlight's own "dark"-logo slot — shown when the page is
     dark, hence light ink here).

     Mark = a forward-facing wolf's head cut from flat planes; one path, one ink.
     Kept in sync by hand with website/landing/assets/wovyr-logo.svg (canonical)
     and ../../pages/index.astro's inline copy — same geometry, three different
     embeddings.

     The wordmark deliberately stays in JetBrains Mono here rather than the
     landing page's Archivo: the docs site self-hosts JetBrains Mono and has not
     been migrated off the cobalt/mono system (see landing/DESIGN-system.md §8).
     The *mark* is unified now so both surfaces show one logo; the lockup's
     typeface follows whichever system its own surface is on until then. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" width="160" height="32"
     role="img" aria-label="Wovyr" style="color:#EAEEF6">
  <g transform="translate(2,1.8) scale(0.264)">
    <path fill="currentColor" d="M50 26 L34 30 L18 6 L22 38 L12 52 L22 60 L16 72 L30 74 L36 64 L40 86 L44 94 L50 97 L56 94 L60 86 L64 64 L70 74 L84 72 L78 60 L88 52 L78 38 L82 6 L66 30 Z"/>
  </g>
  <text x="36" y="22" font-family="'JetBrains Mono','Cascadia Code',ui-monospace,monospace"
        font-size="17" font-weight="650" letter-spacing="0.4" fill="currentColor">wovyr</text>
</svg>
