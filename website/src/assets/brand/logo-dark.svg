<!-- DSY-103: Wovyr wordmark for Starlight's SiteTitle when the DOCS SITE renders
     in dark mode (Starlight's own "dark"-logo slot — shown when the page is
     dark, hence light ink here). Mark = a generative-UI window being
     verified: a UI frame (window + title-bar chrome) with a cobalt scan line
     and a verified node passing through it. Kept in sync by hand with
     website/landing/assets/wovyr-logo.svg (DSY-106's canonical mark) and
     ../../pages/index.astro's inline copy — same shape, same accent, three
     different embeddings (favicon-less full lockup here, inline icon there). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 32" width="160" height="32"
     fill="none" role="img" aria-label="Wovyr" style="color:#EAEEF6">
  <rect x="3" y="6" width="22" height="20" rx="3.4" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="7.6" cy="11" r="1.1" fill="currentColor" opacity="0.55"/>
  <circle cx="11.2" cy="11" r="1.1" fill="currentColor" opacity="0.55"/>
  <path d="M7 18.6H20" stroke="#5B7BFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16.4" cy="18.6" r="2" fill="#5B7BFF"/>
  <text x="40" y="22" font-family="'JetBrains Mono','Cascadia Code',ui-monospace,monospace"
        font-size="17" font-weight="650" letter-spacing="0.4" fill="currentColor">wovyr</text>
</svg>
