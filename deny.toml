# cargo-deny configuration (RM-GA-P4 HLTH-904).
#
# Runs in CI via the `EmbarkStudios/cargo-deny-action` step in the `security` job
# (`.github/workflows/ci.yml`), alongside the existing RustSec advisory check
# (`rustsec/audit-check@v2`) and secret scan (gitleaks). This config focuses on
# what those two don't cover: license policy and duplicate-version drift.

[graph]
# Check the **default** feature set, i.e. what a plain `cargo build` and the
# published container actually contain.
#
# This line was dead config until 2026-08-01: `cargo-deny-action`'s `arguments`
# input defaults to `--all-features`, which overrides it. CI now passes
# `arguments: ""` so this governs for real.
#
# What that deliberately does NOT cover, stated plainly rather than left implied:
# the optional feature-gated dependencies (`mistralrs`, `wasi`, `postgres`,
# `tiered-memory`, `qdrant`, `redis`) are absent from the checked graph, so their
# transitive licences and duplicate versions are unchecked here. `mistralrs` is
# the reason this is the right trade rather than a shortcut — it vendors an
# entire ML + audio stack (candle, tokenizers, symphonia) that contributes dozens
# of duplicate-version bans plus MPL-2.0, 0BSD, Zlib and NCSA licences. MPL-2.0
# in particular is weak copyleft and would be a genuine policy decision, not a
# formality, and `mistralrs` is already excluded from every CI job as too heavy
# to compile.
#
# If an optional backend is ever promoted to shipped-and-audited, add its
# licences here explicitly and re-run with that feature enabled — don't reach for
# `--all-features`, which silently drags `mistralrs` back in with it.
all-features = false

[advisories]
# RustSec advisory scanning is already covered by the `rustsec/audit-check@v2`
# step in the same CI job — don't duplicate it here.
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    # The wasmtime/cranelift/cap-std family's license: Apache-2.0 plus the LLVM
    # linking exception, which *relaxes* Apache-2.0 (it waives the notice
    # requirement for linked binaries) rather than adding an obligation. SPDX
    # treats `Apache-2.0 WITH LLVM-exception` as a distinct identifier, so
    # allowing `Apache-2.0` alone does not cover it — which is why the wasmtime
    # 47 upgrade surfaced this the first time cargo-deny's licenses check
    # actually reached those crates.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # `foldhash`, reached via the `hashbrown` version wasmtime pulls. Permissive
    # and OSI-approved — BSD-like, with no binary-attribution requirement.
    # Included so `cargo deny --features wasi check licences` passes: the WASI
    # sandbox is a genuinely shipped build option (`--features plugin-wasi`), so
    # it should be auditable even though it is not in the default graph.
    "Zlib",
    "Unicode-3.0",
    # webpki-roots' own license (verified against the real dependency tree,
    # not assumed) — a permissive Mozilla-published data-license, not a
    # copyleft/viral one.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "deny"
# `wildcards` (flags an external dependency with no version constraint, e.g.
# `foo = "*"`) is left at its default rather than "deny": every one of this
# workspace's ~19 internal crates references its siblings via `path = "..."`
# workspace dependencies with no `version` field by design (Cargo resolves
# them by workspace membership, not semver) — cargo-deny's `allow-wildcard-paths`
# escape hatch doesn't apply here since it exempts path deps only for crates
# already marked `publish = false`, which none of these are. Turning the lint
# on would mean ~150 permanent false positives with zero real wildcard risk
# (there are no loose-versioned *external* deps in this workspace) rather
# than a signal worth acting on.
skip = [
    # `reqwest` depends on `webpki-roots` 1.x directly while `hyper-rustls`
    # (itself a `reqwest` dependency) still pins 0.26 — an upstream version
    # skew between two crates in the same dependency graph, not something
    # this workspace's own Cargo.toml files influence.
    { name = "webpki-roots", version = "0.26.11" },
    # `ring` (via rustls) pins an older `windows-sys` than the `clap`/`anstream`
    # terminal-styling chain does — another upstream-owned split, same
    # reasoning as above.
    { name = "windows-sys", version = "0.52.0" },
]
# Note: `cargo tree --duplicates` also shows a `rand`/`rand_core`/`rand_chacha`/
# `getrandom` 0.8-vs-0.9-generation split (production JWT/crypto stack vs.
# `proptest`, a dev-dependency of wovyr-plugin/wovyr-workflow's fuzz tests) —
# cargo-deny's own graph resolution doesn't surface it as a `bans` violation
# (confirmed: adding skip entries for it produces "unmatched-skip" warnings,
# meaning cargo-deny doesn't count it as a duplicate in the first place), so
# no skip entry is needed for it here. See
# docs/18-roadmap/v1.0/phase4-contract-operability-tickets.md (HLTH-904) for
# the full accounting of this cluster.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
